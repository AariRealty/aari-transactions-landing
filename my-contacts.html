<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>My Contacts · Aari Transactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ffffff;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#2c2c2a;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}

  /* 1 · Page header */
  h1{font-size:22px;font-weight:500;color:#2c2c2a;letter-spacing:-0.01em}
  .sub{color:#9a9a9a;font-size:13px;margin-top:2px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .back{font-size:13px;color:#5f5e5a;text-decoration:none;border:1px solid #e8e6e1;background:#fff;border-radius:999px;padding:8px 16px}

  /* 2 · Privacy banner */
  .privacy{display:flex;align-items:center;gap:8px;background:#fefaf0;border:0.5px solid #f0e6c0;border-radius:8px;padding:8px 12px;font-size:11px;color:#b09a5a;margin-bottom:14px}
  .privacy .ti{font-size:11px;color:#b09a5a;flex:none}

  /* 3 · Filter pills */
  .pills{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .pill{font-family:inherit;font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;background:#f3f3f1;border:0.5px solid #e8e6e1;color:#9a9a9a}
  .pill.active{background:#2c2c2a;color:#fff;border-color:#2c2c2a}

  /* Search */
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap .ti{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:#b0aca4}
  #search{width:100%;font-family:inherit;font-size:13px;padding:10px 12px 10px 34px;border:0.5px solid #e8e6e1;border-radius:10px;background:#faf9f7;color:#2c2c2a}
  #search:focus{outline:none;border-color:#b0aca4;background:#fff}

  /* 4 · Contact cards */
  .card{background:#fff;border:0.5px solid #e8e6e1;border-radius:10px;padding:10px 14px;margin-bottom:8px}
  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .name{font-size:13px;font-weight:500;color:#2c2c2a}
  .meta{font-size:11px;color:#9a9a9a;word-break:break-word}
  .badge{flex:none;font-size:10px;font-weight:600;border-radius:6px;padding:3px 10px}
  .badge.buyer{background:#e8f5ed;color:#7aab80}
  .badge.seller{background:#fdecea;color:#e0a8a8}
  .badge.title{background:#e6f1fb;color:#7aabd4}
  .badge.lender{background:#EEEDFE;color:#9b97d4}
  .badge.agent{background:#f3f3f1;color:#9a9a9a}

  button{font-family:inherit;cursor:pointer;font-size:11px;border-radius:6px;border:none;padding:3px 10px}
  .btnrow{display:flex;gap:8px;margin-top:8px}
  .btn-edit{background:#e6f1fb;color:#7aabd4}
  .btn-del{background:#fdecea;color:#e0a8a8}
  .btn-save{background:#c5e0c8;color:#7aab80;padding:6px 14px}
  .btn-cancel{background:#f3f3f1;color:#9a9a9a;padding:6px 14px}

  /* Inline delete confirmation */
  .del-confirm{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .del-confirm .q{font-size:11px;color:#9a9a9a;flex:1;min-width:140px}
  .del-confirm button{flex:none}

  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .edit-grid .full{grid-column:1 / -1}
  label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9a9a9a;margin-bottom:4px}
  input{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #e8e6e1;border-radius:8px;background:#fff;color:#2c2c2a}
  input:focus{outline:none;border-color:#b0aca4}

  /* Empty state */
  .empty{padding:44px 20px;text-align:center;color:#9a9a9a;font-size:13px}
  .empty .ti{display:block;font-size:32px;color:#e8e6e1;margin-bottom:10px}
  .empty .t{font-size:13px;color:#9a9a9a;font-weight:500}
  .empty .s{font-size:13px;color:#9a9a9a;margin-top:2px}

  .state{font-size:11px;color:#7aab80;min-height:14px;margin-top:6px}
  .state.err{color:#e0a8a8}
  @media (max-width:520px){ .edit-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>My Contacts</h1>
      <div class="sub">Your private address book</div>
    </div>
    <a class="back" href="/portal.html">← Back to portal</a>
  </div>

  <div class="privacy">
    <i class="ti ti-lock" aria-hidden="true"></i>
    <span>Only you and the Aari Transactions team can view your saved contacts</span>
  </div>

  <div class="search-wrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="search" placeholder="Search by name, email, or phone&hellip;" autocomplete="off">
  </div>

  <div class="pills" id="pills"></div>

  <div id="list"></div>
</div>

<script src="/js/supabase-config.js" defer></script>
<script src="/js/auth.js" defer></script>
<script defer>
(function(){
  let client = null;
  let uid = null;
  let contacts = [];
  let filter = 'all';
  let confirmingDelete = null; // contact id awaiting inline delete confirmation
  let editingId = null;        // don't let a background refresh wipe an open editor

  const TYPES = ['buyer','seller','title','lender','agent'];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function renderPills(){
    const el = document.getElementById('pills');
    el.innerHTML = ['all'].concat(TYPES).map(t =>
      '<button type="button" class="pill' + (filter === t ? ' active' : '') + '" data-pill="' + t + '">' + (t === 'all' ? 'All' : cap(t)) + '</button>'
    ).join('');
  }

  let query = '';
  function visible(){
    let rows = filter === 'all' ? contacts : contacts.filter(c => (c.contact_type || '') === filter);
    if(query){
      const q = query.toLowerCase();
      rows = rows.filter(c => [c.full_name, c.email, c.phone].filter(Boolean).join(' ').toLowerCase().indexOf(q) >= 0);
    }
    return rows;
  }

  function render(){
    renderPills();
    const list = document.getElementById('list');
    const rows = visible();
    if(!rows.length){
      list.innerHTML = contacts.length
        ? (query
            ? '<div class="empty"><i class="ti ti-address-book" aria-hidden="true"></i><div class="t">No contacts match &ldquo;' + esc(query) + '&rdquo;</div></div>'
            : '<div class="empty"><i class="ti ti-address-book" aria-hidden="true"></i><div class="t">No ' + esc(filter) + ' contacts yet</div></div>')
        : '<div class="empty"><i class="ti ti-address-book" aria-hidden="true"></i><div class="t">No contacts saved yet</div><div class="s">Save a contact during file submission to see it here</div></div>';
      return;
    }
    list.innerHTML = rows.map(c => {
      const type = TYPES.indexOf(c.contact_type) >= 0 ? c.contact_type : 'agent';
      const actions = confirmingDelete === c.id
        ? '<div class="del-confirm">' +
            '<span class="q">Are you sure? This cannot be undone</span>' +
            '<button type="button" class="btn-del" data-confirm-del="' + esc(c.id) + '">Yes, delete</button>' +
            '<button type="button" class="btn-cancel" style="padding:3px 10px" data-cancel-del="' + esc(c.id) + '">Cancel</button>' +
          '</div>'
        : '<div class="btnrow">' +
            '<button type="button" class="btn-edit" data-edit="' + esc(c.id) + '">Edit</button>' +
            '<button type="button" class="btn-del" data-del="' + esc(c.id) + '">Delete</button>' +
          '</div>';
      return '<div class="card" data-id="' + esc(c.id) + '">' +
        '<div class="row">' +
          '<div style="min-width:0">' +
            '<div class="name">' + esc(c.full_name || '(no name)') + '</div>' +
            (c.email ? '<div class="meta">' + esc(c.email) + '</div>' : '') +
            (c.phone ? '<div class="meta">' + esc(c.phone) + '</div>' : '') +
          '</div>' +
          '<span class="badge ' + type + '">' + cap(type) + '</span>' +
        '</div>' +
        actions +
        '<div class="state" data-state="' + esc(c.id) + '"></div>' +
      '</div>';
    }).join('');
  }

  function renderEdit(id){
    const c = contacts.find(x => x.id === id);
    const card = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
    if(!c || !card) return;
    editingId = id;
    card.innerHTML = `
      <div class="edit-grid">
        <div class="full">
          <label>Full name</label>
          <input type="text" data-f="full_name" value="${esc(c.full_name)}">
        </div>
        <div>
          <label>Email</label>
          <input type="email" data-f="email" value="${esc(c.email)}">
        </div>
        <div>
          <label>Phone</label>
          <input type="tel" data-f="phone" value="${esc(c.phone)}">
        </div>
        <div class="full" style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" class="btn-cancel" data-cancel="${esc(id)}">Cancel</button>
          <button type="button" class="btn-save" data-save="${esc(id)}">Save changes</button>
        </div>
      </div>
      <div class="state" data-state="${esc(id)}"></div>`;
  }

  function setState(id, msg, isErr){
    const el = document.querySelector('.state[data-state="' + CSS.escape(id) + '"]');
    if(el){ el.textContent = msg || ''; el.className = 'state' + (isErr ? ' err' : ''); }
  }

  async function saveEdit(id){
    const card = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
    if(!card) return;
    const get = (f) => { const el = card.querySelector('[data-f="' + f + '"]'); return el ? el.value.trim() : ''; };
    const upd = {
      full_name: get('full_name'),
      email: get('email').toLowerCase(),
      phone: get('phone'),
      updated_at: new Date().toISOString()
    };
    if(!upd.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(upd.email)){
      setState(id, 'A valid email is required — it keeps duplicates out.', true);
      return;
    }
    setState(id, 'Saving…');
    const r = await client.from('agent_contacts').update(upd).eq('id', id);
    if(r && r.error){
      const dupe = /duplicate|unique/i.test(r.error.message || '');
      setState(id, dupe ? 'You already have a contact with that email.' : 'Could not save — try again.', true);
      return;
    }
    const i = contacts.findIndex(x => x.id === id);
    if(i >= 0) contacts[i] = Object.assign({}, contacts[i], upd);
    editingId = null;
    render();
    setState(id, '✓ Saved');
  }

  async function removeContact(id){
    const r = await client.from('agent_contacts').delete().eq('id', id);
    if(r && r.error){ setState(id, 'Could not delete — try again.', true); confirmingDelete = null; return; }
    contacts = contacts.filter(x => x.id !== id);
    confirmingDelete = null;
    render();
  }

  document.addEventListener('input', (e) => {
    if(e.target && e.target.id === 'search'){
      query = e.target.value.trim();
      confirmingDelete = null;
      render();
    }
  });

  document.addEventListener('click', (e) => {
    const pl = e.target.closest('[data-pill]');
    if(pl){ filter = pl.getAttribute('data-pill'); confirmingDelete = null; editingId = null; render(); return; }
    const ed = e.target.closest('[data-edit]');
    if(ed){ confirmingDelete = null; renderEdit(ed.getAttribute('data-edit')); return; }
    const sv = e.target.closest('[data-save]');
    if(sv){ saveEdit(sv.getAttribute('data-save')); return; }
    const ca = e.target.closest('[data-cancel]');
    if(ca){ editingId = null; render(); return; }
    const dl = e.target.closest('[data-del]');
    if(dl){ confirmingDelete = dl.getAttribute('data-del'); render(); return; }
    const cd = e.target.closest('[data-confirm-del]');
    if(cd){ removeContact(cd.getAttribute('data-confirm-del')); return; }
    const xd = e.target.closest('[data-cancel-del]');
    if(xd){ confirmingDelete = null; render(); return; }
  });

  async function loadContacts(){
    const r = await client.from('agent_contacts')
      .select('id, contact_type, full_name, email, phone, created_at')
      .eq('agent_id', uid)
      .order('created_at', { ascending: false });
    if(r && r.error){ console.warn('[my-contacts] load failed', r.error); return false; }
    contacts = r.data || [];
    if(!editingId) render(); // don't wipe an open editor mid-typing
    return true;
  }

  function wireLiveUpdates(){
    // Realtime: a contact saved during a submission in another tab shows up here.
    try {
      client.channel('agent-contacts-live')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'agent_contacts', filter: 'agent_id=eq.' + uid },
          function(){ loadContacts(); })
        .subscribe();
    } catch(e){ console.warn('[my-contacts] realtime unavailable', e); }
    // Fallback that always works: refetch when the tab regains focus.
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible') loadContacts();
    });
  }

  async function init(){
    try{
      const session = await window.AariAuth.getCurrentSession();
      if(!session || !session.user){
        window.location.href = '/login.html?next=' + encodeURIComponent('/my-contacts.html');
        return;
      }
      uid = session.user.id;
      client = await window.AariAuth.ensureClient();
      const ok = await loadContacts();
      if(!ok){
        document.getElementById('list').innerHTML = '<div class="empty"><i class="ti ti-address-book" aria-hidden="true"></i><div class="t">Could not load your contacts</div><div class="s">Refresh to try again</div></div>';
        return;
      }
      wireLiveUpdates();
    }catch(err){
      console.error('[my-contacts] init failed', err);
      document.getElementById('list').innerHTML = '<div class="empty"><i class="ti ti-address-book" aria-hidden="true"></i><div class="t">Something went wrong</div><div class="s">Refresh to try again</div></div>';
    }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
