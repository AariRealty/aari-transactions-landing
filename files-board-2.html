<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board · Mock 2 · Stage accordion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--green:#3e7d57;--sans:'Inter',-apple-system,sans-serif;--serif:Georgia,'Times New Roman',serif;--playfair:'Playfair Display',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;padding:16px 16px 90px}

  /* MOCK 2 · STAGE ACCORDION
     No swiping. Every stage is a collapsed bar. Tap to expand and see
     files. Only "Needs you" opens by default. Quietest at rest — you
     see the whole pipeline distribution at a glance (all counts visible)
     and drill in on demand.                                                 */

  .hdr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .hdr .title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.3px}
  .hdr .ct{font-family:var(--playfair);font-size:15px;font-weight:500;color:var(--muted)}

  .sub{font-size:11.5px;color:var(--muted);margin-bottom:12px;line-height:1.4}
  .sub b{color:var(--red);font-weight:700}

  .search{position:relative;margin-bottom:10px}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:100%;background:#fff;border:0.5px solid rgba(15,15,15,0.16);border-radius:10px;padding:10px 12px 10px 36px;font-size:16px;font-family:inherit;outline:none;min-height:42px}

  .seg{display:inline-flex;background:#f4f1ec;border-radius:20px;padding:2px;margin-bottom:12px}
  .seg button{border:0;background:transparent;font:600 11px 'Inter',sans-serif;color:#7a756c;padding:6px 14px;border-radius:18px;cursor:pointer;min-height:32px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* Accordion */
  details.stage{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:12px;margin-bottom:8px;overflow:hidden}
  details.stage summary{display:flex;align-items:center;gap:10px;padding:14px 14px;cursor:pointer;list-style:none;min-height:52px}
  details.stage summary::-webkit-details-marker{display:none}
  details.stage summary .name{flex:1;font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink)}
  details.stage summary .ct{font-family:var(--playfair);font-size:20px;font-weight:500;color:var(--ink);line-height:1;letter-spacing:-0.5px}
  details.stage summary .chev{color:var(--muted-2);font-size:14px;transition:transform .2s;flex:none;width:16px;text-align:right}
  details.stage[open] summary .chev{transform:rotate(180deg)}

  details.stage.attn{border-color:rgba(163,64,47,0.4)}
  details.stage.attn summary{position:relative}
  details.stage.attn summary::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--red);border-radius:2px}
  details.stage.attn summary .ct,
  details.stage.attn summary .name{color:var(--red)}

  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:0.5px solid #f3ede0;cursor:pointer;min-height:52px}
  .row .body{flex:1;min-width:0}
  .row .a{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .row .m{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .r{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:0.2px;flex:none}
  .row .r.warn{color:var(--red)}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<div class="hdr">
  <h2 class="title">Board</h2>
  <span class="ct">22 active</span>
</div>
<div class="sub"><b>2 need you</b> · 5 under contract · 15 listings</div>

<div class="search">
  <span class="ic">🔍</span>
  <input placeholder="Search address, client, agent…">
</div>

<div class="seg"><button class="on">All 22</button><button>Sales 7</button><button>Listings 15</button></div>

<details class="stage attn" open>
  <summary><span class="name">Needs you</span><span class="ct">2</span><span class="chev">⌄</span></summary>
  <div class="row"><div class="body"><div class="a">3815 NW 22nd Ter</div><div class="m">Milennys · inspection missed</div></div><span class="r warn">1d late</span></div>
  <div class="row"><div class="body"><div class="a">4700 32nd Ave SW</div><div class="m">Milennys · escrow deposit</div></div><span class="r warn">today</span></div>
</details>

<details class="stage">
  <summary><span class="name">New · awaiting TC</span><span class="ct">0</span><span class="chev">⌄</span></summary>
</details>

<details class="stage">
  <summary><span class="name">Under contract</span><span class="ct">5</span><span class="chev">⌄</span></summary>
</details>

<details class="stage">
  <summary><span class="name">Pending</span><span class="ct">1</span><span class="chev">⌄</span></summary>
</details>

<details class="stage">
  <summary><span class="name">MLS Setup</span><span class="ct">15</span><span class="chev">⌄</span></summary>
</details>

<details class="stage">
  <summary><span class="name">Closed YTD</span><span class="ct">6</span><span class="chev">⌄</span></summary>
</details>

<div class="mock-chip">
  Board <a href="/files-board-1.html">1</a> <a href="/files-board-2.html" class="on">2</a> <a href="/files-board-3.html">3</a>
</div>

</body>
</html>
