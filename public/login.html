<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Aari Transactions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230f0f0f'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-weight='600' font-size='38' fill='%23ffffff' letter-spacing='-1'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/auth.css">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#0f0f0f; --muted:#5f5e5a; --line:rgba(15,15,15,0.10); --cream:#fbf9f4; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink); background:var(--cream); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.5; }
  .card { max-width:440px; width:100%; background:#fff; border:0.5px solid var(--line); border-radius:10px; padding:36px 32px; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,0.04); }
  .mark { font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:30px; letter-spacing:4px; padding:6px 12px; border:1.5px solid var(--ink); border-radius:8px; display:inline-block; margin-bottom:22px; }
  .eb { font-size:11px; color:var(--muted); letter-spacing:.7px; text-transform:uppercase; font-weight:600; margin-bottom:8px; }
  h1 { font-family:'Playfair Display',Georgia,serif; font-size:24px; font-weight:500; letter-spacing:-0.3px; margin-bottom:8px; }
  p { font-size:13px; color:var(--muted); margin-bottom:24px; }
  .btn { display:inline-block; background:var(--ink); color:#fff; padding:12px 26px; border-radius:6px; font-size:13.5px; font-weight:500; text-decoration:none; cursor:pointer; border:0; font-family:inherit; }
  .btn:hover { background:#222; }
  .fine { font-size:11px; color:#888; margin-top:24px; line-height:1.5; }
  .fine a { color:var(--ink); text-decoration:underline; text-underline-offset:2px; }
</style>
</head>
<body>

<div class="card">
  <div class="mark">AARI</div>
  <div class="eb">Aari Transactions</div>
  <h1>Sign in to your account</h1>
  <p>Click below to sign in. The login dialog will open on this page.</p>
  <button type="button" class="btn" data-aari-login>Sign in</button>
  <div class="fine">
    Don't have an account yet?<br>
    <a href="/register.html">Create one for free →</a>
  </div>
</div>

<script src="/js/supabase-config.js?v=29"></script>
<script src="/js/auth.js"></script>
<script src="/js/login-modal.js?v=36"></script>
<script>
// Auto-open the login modal on page load so users don't have to click twice
(function(){
  function tryOpen(attempts){
    if(attempts > 50) return;
    const btn = document.querySelector('[data-aari-login]');
    if(btn && typeof btn.click === 'function'){ btn.click(); return; }
    setTimeout(() => tryOpen(attempts + 1), 100);
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => tryOpen(0));
  } else {
    tryOpen(0);
  }
})();
</script>

</body>
</html>
