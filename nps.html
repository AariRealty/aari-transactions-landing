<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-second feedback · Aari Transactions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#0f0f0f; --muted:#5f5e5a; --line:rgba(15,15,15,0.10); --green:#2f855a; --red:#c44b3b; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); background: #f3f3f1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:520px; width:100%; background:#fff; border:0.5px solid var(--line); border-radius:10px; padding:32px 30px; box-shadow:0 4px 16px rgba(0,0,0,0.04); }
  .eb { font-size:11px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; font-weight:600; margin-bottom:8px; }
  h1 { font-family:'Playfair Display',Georgia,serif; font-size:24px; font-weight:500; letter-spacing:-0.3px; line-height:1.25; margin-bottom:6px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:24px; line-height:1.5; }

  .scale { display:grid; grid-template-columns:repeat(11, 1fr); gap:4px; margin-bottom:6px; }
  .scale button { background:#fff; border:0.5px solid var(--line); border-radius:6px; padding:14px 0; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; color:var(--ink); transition:transform .12s, border-color .12s, background .12s; }
  .scale button:hover { border-color:var(--ink); transform:translateY(-1px); }
  .scale button.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  .scale-ends { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:22px; }
  @media (max-width: 520px) { .scale { grid-template-columns:repeat(6, 1fr); } }

  .lbl { display:flex; flex-direction:column; gap:6px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600; margin-bottom:16px; }
  textarea { font-family:inherit; font-size:13px; padding:10px 12px; border:0.5px solid var(--line); border-radius:6px; color:var(--ink); text-transform:none; letter-spacing:0; font-weight:400; resize:vertical; min-height:90px; }
  textarea:focus { outline:none; border-color:var(--ink); }

  .perm { display:flex; align-items:flex-start; gap:10px; font-size:12px; color:var(--ink); line-height:1.45; margin-bottom:22px; cursor:pointer; }
  .perm input { margin-top:2px; }

  .btn { background:var(--ink); color:#fff; border:0; padding:13px 26px; border-radius:6px; font-size:13.5px; font-weight:500; cursor:pointer; font-family:inherit; width:100%; }
  .btn:hover { background:#222; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }

  .status { font-size:13px; padding:10px 14px; border-radius:6px; margin-top:14px; display:none; }
  .status.ok { display:block; background:#f0f7f3; color:var(--green); }
  .status.err { display:block; background:#fbeae6; color:var(--red); }

  .done { text-align:center; padding:30px 0; }
  .done .check { width:54px; height:54px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:#fff; font-size:28px; }
  .done h2 { font-family:'Playfair Display',Georgia,serif; font-size:22px; font-weight:500; margin-bottom:8px; }
  .done p { font-size:13px; color:var(--muted); line-height:1.55; }
</style>
</head>
<body>

<div class="card" id="card">
  <div id="form-view">
    <p class="eb" id="addr">&nbsp;</p>
    <h1>How was working with us?</h1>
    <p class="sub">One number. One sentence. We use it to keep the bar high.</p>

    <div class="scale" id="scale">
      <button type="button" data-v="0">0</button>
      <button type="button" data-v="1">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="4">4</button>
      <button type="button" data-v="5">5</button>
      <button type="button" data-v="6">6</button>
      <button type="button" data-v="7">7</button>
      <button type="button" data-v="8">8</button>
      <button type="button" data-v="9">9</button>
      <button type="button" data-v="10">10</button>
    </div>
    <div class="scale-ends">
      <span>Wouldn't recommend</span>
      <span>Definitely recommend</span>
    </div>

    <label class="lbl">What stood out (or what should change)?
      <textarea id="comment" rows="3" placeholder="Optional but appreciated"></textarea>
    </label>

    <label class="perm">
      <input type="checkbox" id="perm">
      <span>Aari may share my feedback as a public testimonial with my name attached.</span>
    </label>

    <button type="button" class="btn" id="submit" disabled>Send feedback</button>
    <div class="status" id="status"></div>
  </div>

  <div id="done-view" style="display:none">
    <div class="done">
      <div class="check">✓</div>
      <h2>Thank you.</h2>
      <p>Marlenyi reads every single one of these.<br>If your feedback flagged something off, expect a call.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script>
(function(){
  'use strict';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');
  if(!token){
    document.getElementById('card').innerHTML = '<h1 style="font-family:\'Playfair Display\',serif">Link expired or invalid.</h1><p style="color:#5f5e5a;margin-top:12px">If you meant to leave feedback, email <a href="mailto:hello@aaritransactions.com" style="color:#0f0f0f">hello@aaritransactions.com</a>.</p>';
    return;
  }

  if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
    document.getElementById('card').innerHTML = '<h1>Configuration error</h1>';
    return;
  }
  const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  let score = null;

  // Hydrate file address via RPC-less query — RLS allows reading own nps row by token? No.
  // We're not authenticated. So we'll just leave the address blank or load via edge function.
  // Quietly skip address hydration in the no-auth flow.

  document.querySelectorAll('#scale button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#scale button').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      score = parseInt(btn.getAttribute('data-v'), 10);
      document.getElementById('submit').disabled = false;
    });
  });

  document.getElementById('submit').addEventListener('click', async () => {
    if(score == null) return;
    const btn = document.getElementById('submit');
    const status = document.getElementById('status');
    const comment = document.getElementById('comment').value.trim();
    const perm = document.getElementById('perm').checked;
    btn.disabled = true; btn.textContent = 'Sending…';
    status.className = 'status';
    try {
      const { error } = await client.from('agent_nps').update({
        score: score,
        comment: comment || null,
        may_share_as_testimonial: perm,
        responded_at: new Date().toISOString(),
      }).eq('token', token).is('responded_at', null);
      if(error) throw error;
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('done-view').style.display = 'block';
    } catch(err){
      status.className = 'status err';
      status.textContent = 'Something went wrong: ' + (err.message || 'unknown');
      btn.disabled = false; btn.textContent = 'Send feedback';
    }
  });
})();
</script>
</body>
</html>
