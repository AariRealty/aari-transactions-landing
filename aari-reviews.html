<!doctype html>
<!--
  ============================================================================
  AARI TRANSACTIONS · Reviews moderation (staff-only)
  ============================================================================
  Audience: Marlenyi (broker-owner) + Mile/Eileen/Silvia
  Hidden surface · noindex · auth-gated.

  Approve client reviews submitted via /client-review.html → publish to /reviews.html
  Reject moves the review to archive. Edit lets you correct typos with audit trail.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews &middot; Moderation &middot; Client Tracker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230f0f0f'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-weight='600' font-size='38' fill='%23ffffff' letter-spacing='-1'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/auth.css">
<style>
  :root {
    --ink: #0f0f0f;
    --ink-2: #262626;
    --muted: #6b6b6b;
    --line: #e6e2d8;
    --bg: #fafaf6;
    --surface: #ffffff;
    --tinted: #f6f3ec;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink-2); font-size: 13px; line-height: 1.55; min-height: 100vh; -webkit-font-smoothing: antialiased; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand-mark { font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--ink); padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: 5px; letter-spacing: 2px; }
  .brand-name { font-family: var(--sans); font-weight: 600; font-size: 12px; color: var(--ink); line-height: 1.15; }
  .brand-name small { display: block; font-size: 8px; font-weight: 500; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .top-right { display: flex; align-items: center; gap: 14px; font-size: 12px; }
  .user-info { color: var(--ink); font-weight: 500; }
  .signout { color: var(--muted); text-decoration: underline; font-size: 11px; cursor: pointer; }
  .crm-link { color: var(--muted); font-size: 11px; }
  .crm-link:hover { color: var(--ink); }

  .gate { display: none; min-height: 70vh; align-items: center; justify-content: center; padding: 24px; }
  .gate.show { display: flex; }
  .gate-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 36px 32px; max-width: 440px; width: 100%; text-align: center; }
  .gate-card h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; color: var(--ink); margin-bottom: 10px; }
  .gate-card p { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin-bottom: 18px; }
  .gate-card .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none; min-height: 44px; box-sizing: border-box; }

  .page-title { padding: 22px 24px 4px; }
  .page-title h1 { font-family: var(--serif); font-weight: 500; font-size: 28px; color: var(--ink); letter-spacing: -0.01em; }
  .page-title .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .tabs { display: flex; gap: 0; padding: 14px 24px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--surface); align-items: center; }
  .tab { padding: 12px 14px; font-size: 11px; font-weight: 500; color: var(--muted); cursor: pointer; border: none; background: transparent; font-family: var(--sans); letter-spacing: 1.2px; text-transform: uppercase; line-height: 1; white-space: nowrap; position: relative; margin-bottom: -1px; min-height: 44px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); font-weight: 700; }
  .tab.active::after { content: ''; position: absolute; bottom: 0; left: 14px; right: 14px; height: 2px; background: var(--ink); }
  .tab:focus-visible { outline: 3px solid #1e7ce8; outline-offset: -3px; }
  .tab .badge { background: #cc3333; color: #fff; font-size: 9px; padding: 2px 7px; border-radius: 10px; margin-left: 4px; font-weight: 700; }
  .tab .badge.zero { display: none; }
  .tab .count-soft { color: var(--muted); font-weight: 500; margin-left: 2px; }

  main { padding: 16px 24px 40px; max-width: 1080px; }

  .review-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; margin-bottom: 12px; }
  .review-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .review-id-block .name { font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--ink); }
  .review-id-block .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-left: 8px; }
  .status-pending { background: #fff4d6; color: #8a6630; }
  .status-approved { background: #e6f0e6; color: #4a7a4a; }
  .status-rejected { background: #f0e0e0; color: #a86666; }
  .rating-block { text-align: right; }
  .rating-stars { font-family: var(--serif); font-size: 22px; color: var(--ink); letter-spacing: 0.5px; }
  .rating-label { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }

  .review-body { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink); line-height: 1.5; padding-left: 14px; border-left: 3px solid var(--ink); margin-bottom: 16px; }

  .review-actions { display: flex; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .btn-approve { background: var(--ink); color: #fff; padding: 9px 16px; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; border-radius: 999px; border: 1px solid var(--ink); cursor: pointer; font-family: var(--sans); min-height: 40px; }
  .btn-approve:hover { background: #333; }
  .btn-edit { background: transparent; color: var(--ink); border: 1px solid var(--ink); padding: 9px 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; border-radius: 999px; cursor: pointer; font-family: var(--sans); min-height: 40px; }
  .btn-edit:hover { background: var(--ink); color: #fff; }
  .btn-reject { background: transparent; color: #cc3333; border: 1px solid #f0d0d0; padding: 9px 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; border-radius: 999px; cursor: pointer; font-family: var(--sans); min-height: 40px; }
  .btn-reject:hover { background: #cc3333; color: #fff; border-color: #cc3333; }
  .btn-unpublish { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 9px 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; border-radius: 999px; cursor: pointer; font-family: var(--sans); min-height: 40px; }
  .btn-unpublish:hover { color: var(--ink); border-color: var(--ink); }
  .audit-trail { font-size: 11px; color: var(--muted); margin-left: auto; }
  .review-actions button:focus-visible { outline: 3px solid #1e7ce8; outline-offset: 2px; }

  .empty-state { text-align: center; padding: 56px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .empty-state h3 { font-family: var(--serif); font-size: 22px; color: var(--ink); font-weight: 500; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; color: var(--ink-2); line-height: 1.6; max-width: 460px; margin: 0 auto; }

  .view { display: none; }
  .view.active { display: block; }

  @media (max-width: 700px) {
    .review-actions { gap: 8px; }
    .audit-trail { margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>
<body>

<!-- Shared chrome · slim header + Where-to banner -->
<div id="aari-header" data-aari-view="reviews" data-aari-show-submit="no"></div>
<script src="/js/aari-header.js" defer></script>
<script src="/js/aari-banner.js?v=9" defer></script>

<header class="top-bar">
  <a href="aari-crm.html" class="brand">
    <span class="brand-mark">AARI</span>
    <span class="brand-name">Reviews<small>STAFF &middot; MODERATION</small></span>
  </a>
  <div class="top-right">
    <a href="aari-crm.html" class="crm-link">&larr; Client Tracker</a>
    <div>
      <div class="user-info" id="user-name">Loading...</div>
    </div>
    <a class="signout" id="signout">Sign out</a>
  </div>
</header>

<div class="gate" id="auth-gate">
  <div class="gate-card">
    <h2 id="gate-title">Staff access only.</h2>
    <p id="gate-message">This page is for Aari Transactions staff. Sign in with your staff account to continue.</p>
    <a href="index.html" class="btn">Back to home</a>
  </div>
</div>

<main id="moderation-main" style="display:none">

  <div class="page-title">
    <h1>Reviews.</h1>
    <p class="sub">Client submissions from client-review.html. Approve to publish on reviews.html. Reject to archive.</p>
  </div>

  <nav class="tabs" role="tablist" aria-label="Review status filter">
    <button type="button" class="tab active" data-status="pending" role="tab">Pending <span class="badge" id="badge-pending">0</span></button>
    <button type="button" class="tab" data-status="approved" role="tab">Approved <span class="count-soft" id="count-approved">0</span></button>
    <button type="button" class="tab" data-status="rejected" role="tab">Rejected <span class="count-soft" id="count-rejected">0</span></button>
    <button type="button" class="tab" data-status="all" role="tab">All <span class="count-soft" id="count-all">0</span></button>
  </nav>

  <section class="view active" id="view-pending"><div class="reviews-list" id="list-pending"></div></section>
  <section class="view" id="view-approved"><div class="reviews-list" id="list-approved"></div></section>
  <section class="view" id="view-rejected"><div class="reviews-list" id="list-rejected"></div></section>
  <section class="view" id="view-all"><div class="reviews-list" id="list-all"></div></section>

</main>

<script src="js/supabase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/login-modal.js?v=36" defer></script>
<script src="js/aari-analytics.js" defer></script>

<script>
(function() {
  'use strict';

  // ============== AUTH GATE ==============
  async function initAuth() {
    if (typeof window.AariAuth === 'undefined') { setTimeout(initAuth, 120); return; }
    try {
      await window.AariAuth.ensureClient();
      const session = await window.AariAuth.getCurrentSession();
      if (!session) { showGate('Sign in required.', 'Sign in with your Aari staff account to access reviews moderation.'); return; }
      const profile = await window.AariAuth.getAgentProfile();
      if (!profile) { showGate('No staff profile found.', 'This account does not have moderation access.'); return; }
      // AARI:WIRE · staff role check
      // const isStaff = profile.is_staff === true || profile.role === 'tc' || profile.role === 'broker';
      // if (!isStaff) { showGate('Staff only.', 'This account cannot moderate reviews.'); return; }
      showApp(profile);
    } catch (err) {
      console.error('[AariReviews auth]', err);
      showGate('Sign-in error.', (err && err.message) || 'Try again or contact hello@aaritransactions.com.');
    }
  }
  function showGate(title, msg) {
    document.getElementById('moderation-main').style.display = 'none';
    const g = document.getElementById('auth-gate');
    g.classList.add('show');
    document.getElementById('gate-title').textContent = title;
    document.getElementById('gate-message').textContent = msg;
  }
  function showApp(profile) {
    document.getElementById('auth-gate').classList.remove('show');
    document.getElementById('moderation-main').style.display = 'block';
    const name = ((profile.first_name || '') + ' ' + (profile.last_name || '')).trim() || 'Staff';
    document.getElementById('user-name').textContent = name;
    loadReviews();
  }
  initAuth();

  document.getElementById('signout').addEventListener('click', async function(e) {
    e.preventDefault();
    try { await window.AariAuth.signOut(); } catch (err) {}
    window.location.href = 'index.html';
  });

  // ============== TAB SWITCHING ==============
  document.querySelectorAll('.tab[data-status]').forEach(t => {
    t.addEventListener('click', function() {
      const status = t.getAttribute('data-status');
      document.querySelectorAll('.tab[data-status]').forEach(x => x.classList.toggle('active', x === t));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + status));
    });
  });

  // ============== LOAD REVIEWS ==============
  // AARI:WIRE · Replace with Supabase query.
  //   client_reviews table (id, client_name, client_email, attribution_choice,
  //                          attribution_display, rating, body, side,
  //                          market_slug, file_ref, consent_timestamp,
  //                          consent_user_agent, status, submitted_at,
  //                          reviewed_at, reviewed_by, published_at,
  //                          notes_internal)
  //   Query: SELECT * FROM client_reviews ORDER BY submitted_at DESC
  async function loadReviews() {
    // AARI:WIRE · const { data } = await supabase.from('client_reviews').select('*').order('submitted_at', { ascending: false });
    // renderReviews(data || []);
    renderReviews([]);
  }

  function renderReviews(reviews) {
    const buckets = { pending: [], approved: [], rejected: [], all: reviews };
    reviews.forEach(r => { if (buckets[r.status]) buckets[r.status].push(r); });

    // Update badge + counts
    const pendingBadge = document.getElementById('badge-pending');
    pendingBadge.textContent = buckets.pending.length;
    pendingBadge.classList.toggle('zero', buckets.pending.length === 0);
    document.getElementById('count-approved').textContent = buckets.approved.length;
    document.getElementById('count-rejected').textContent = buckets.rejected.length;
    document.getElementById('count-all').textContent = reviews.length;

    Object.keys(buckets).forEach(k => {
      const container = document.getElementById('list-' + k);
      if (!container) return;
      if (!buckets[k].length) {
        container.innerHTML = '<div class="empty-state">' +
          '<h3>No ' + k + ' reviews.</h3>' +
          '<p>' + emptyMessage(k) + '</p></div>';
        return;
      }
      container.innerHTML = buckets[k].map(r => reviewCard(r)).join('');
    });
  }

  function emptyMessage(status) {
    if (status === 'pending') return 'When a client submits via client-review.html, the review lands here for your review.';
    if (status === 'approved') return 'Approved reviews appear here and on the public /reviews.html page.';
    if (status === 'rejected') return 'Rejected reviews are archived here for audit.';
    return 'No reviews submitted yet.';
  }

  function reviewCard(r) {
    const stars = '★'.repeat(r.rating || 0) + '☆'.repeat(5 - (r.rating || 0));
    const fileMeta = (r.closed_at_display || '') + (r.file_ref ? ' · ' + r.file_ref : '') + (r.side ? ' · ' + (r.side === 'buyer' ? 'Buyer side' : 'Seller side') : '');
    const statusPill = '<span class="status-pill status-' + (r.status || 'pending') + '">' + (r.status || 'pending') + '</span>';
    let actions;
    if (r.status === 'approved') {
      actions = '<button type="button" class="btn-unpublish" data-action="unpublish" data-review-id="' + r.id + '">Unpublish</button>' +
                '<button type="button" class="btn-edit" data-action="edit" data-review-id="' + r.id + '">Edit</button>';
    } else if (r.status === 'rejected') {
      actions = '<button type="button" class="btn-approve" data-action="approve" data-review-id="' + r.id + '">Restore</button>';
    } else {
      actions = '<button type="button" class="btn-approve" data-action="approve" data-review-id="' + r.id + '">Approve &amp; publish</button>' +
                '<button type="button" class="btn-edit" data-action="edit" data-review-id="' + r.id + '">Edit</button>' +
                '<button type="button" class="btn-reject" data-action="reject" data-review-id="' + r.id + '">Reject</button>';
    }
    return '<div class="review-card" data-review-id="' + r.id + '">' +
      '<div class="review-head">' +
        '<div class="review-id-block">' +
          '<div class="name">' + (r.attribution_display || r.client_name || 'Unknown') + statusPill + '</div>' +
          '<div class="meta">' + fileMeta + '</div>' +
        '</div>' +
        '<div class="rating-block">' +
          '<div class="rating-stars">' + stars + '</div>' +
          '<div class="rating-label">' + (r.rating || 0) + ' of 5</div>' +
        '</div>' +
      '</div>' +
      '<p class="review-body">&ldquo;' + (r.body || '').replace(/</g, '&lt;') + '&rdquo;</p>' +
      '<div class="review-actions">' + actions +
        '<span class="audit-trail">Permission to publish: <strong style="color:var(--ink)">granted</strong> · ' + (r.client_email || '') + ' · attribution: ' + (r.attribution_choice || '') + '</span>' +
      '</div>' +
    '</div>';
  }

  // ============== ACTION HANDLERS ==============
  document.querySelectorAll('.reviews-list').forEach(list => {
    list.addEventListener('click', function(e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');
      const id = btn.getAttribute('data-review-id');
      if (action === 'approve') approveReview(id);
      else if (action === 'reject') rejectReview(id);
      else if (action === 'edit') editReview(id);
      else if (action === 'unpublish') unpublishReview(id);
    });
  });

  async function approveReview(id) {
    if (!confirm('Approve this review and publish to reviews.html?')) return;
    // AARI:WIRE · await supabase.from('client_reviews').update({ status:'approved', published_at: new Date().toISOString(), reviewed_at: new Date().toISOString(), reviewed_by: currentUserId }).eq('id', id);
    console.info('[AariReviews] Approve:', id);
    loadReviews();
  }
  async function rejectReview(id) {
    const reason = prompt('Reason for rejection (internal, not shown to client):');
    if (reason === null) return;
    // AARI:WIRE · await supabase.from('client_reviews').update({ status:'rejected', reviewed_at: new Date().toISOString(), reviewed_by: currentUserId, notes_internal: reason }).eq('id', id);
    console.info('[AariReviews] Reject:', id, reason);
    loadReviews();
  }
  function editReview(id) {
    // AARI:WIRE · open edit modal · update review body, preserve original in audit log
    console.info('[AariReviews] Edit:', id);
  }
  async function unpublishReview(id) {
    if (!confirm('Unpublish this review from reviews.html? It moves back to pending.')) return;
    // AARI:WIRE · await supabase.from('client_reviews').update({ status:'pending', published_at: null }).eq('id', id);
    console.info('[AariReviews] Unpublish:', id);
    loadReviews();
  }

})();
</script>

</body>
</html>
