<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files top · Mock 1 · Zero-chrome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ffffff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
  .nav{position:sticky;top:0;z-index:90;background:rgba(251,249,244,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
  .nav-wrap{max-width:720px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{height:40px;width:auto;display:block}
  .brand .name{font-weight:700;font-size:14px;letter-spacing:-0.01em}
  .brand .name small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-top:2px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none;overflow:hidden}
  main{max-width:720px;margin:0 auto;padding:14px 16px 40px}

  /* TOP MOCK 1 · ZERO CHROME · nothing but search until the calendar */
  .search-only{position:relative;margin-bottom:16px}
  .search-only .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .search-only input{width:100%;background:#fff;border:0.5px solid rgba(15,15,15,0.16);border-radius:12px;padding:14px 14px 14px 42px;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;min-height:48px}
  .search-only input::placeholder{color:#a09b8f}

  /* Discreet ledge above the calendar */
  .ledge{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 12px;font-size:11.5px;font-weight:500;color:var(--muted)}
  .ledge .red{color:var(--red);font-weight:700}
  .ledge .dot{color:var(--muted-2);margin:0 4px}
  .ledge a{color:var(--ink);text-decoration:none;font-weight:600;border-bottom:1px solid transparent;padding-bottom:1px}
  .ledge a:hover{border-bottom-color:var(--ink)}

  /* Placeholder calendar card so context reads */
  .fake-cal{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:16px;padding:16px;color:var(--muted);font-size:12px;font-style:italic;text-align:center}

  /* Bell + New file FABs · shown so the whole picture reads */
  .fabs{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column-reverse;gap:12px;z-index:80}
  .fab{border:0;padding:0;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
  .fab:active{transform:scale(.94)}
  .fab-new{width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;font-size:30px;font-weight:300;line-height:1;box-shadow:0 10px 26px rgba(0,0,0,0.28)}
  .fab-bell{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--ink);border:0.5px solid rgba(15,15,15,0.15);box-shadow:0 6px 18px rgba(0,0,0,0.14)}
  .fab-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font:700 10px 'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center}

  /* Bottom tab bar mimic */
  .mnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ece8e0;padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;z-index:70}
  .mnav a{flex:1;text-align:center;font-size:9.5px;font-weight:600;color:#8a857c;text-decoration:none;padding:4px 0;letter-spacing:.3px}
  .mnav a.on{color:var(--ink)}
  .mnav .ic{display:block;font-size:16px;margin-bottom:2px}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a class="brand" href="/portal"><img src="images/aari-logo.png" alt="Aari Transactions"><span class="name">Aari Transactions<small>Florida TC</small></span></a>
    <a class="av" href="/portal">M</a>
  </div>
</nav>

<main>

  <div class="search-only">
    <span class="ic">🔍</span>
    <input placeholder="Search address, client, agent…">
  </div>

  <div class="ledge">
    <span><span class="red">5 need you</span> <span class="dot">·</span> 22 active</span>
    <a href="#">All TCs ▾</a>
  </div>

  <div class="fake-cal">↓ Calendar section appears here (unchanged)</div>

</main>

<div class="fabs">
  <button class="fab fab-bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="fab-badge">1</span></button>
  <button class="fab fab-new">+</button>
</div>

<nav class="mnav">
  <a href="#" class="on"><span class="ic">◉</span>Today</a>
  <a href="#"><span class="ic">▦</span>Board</a>
  <a href="#"><span class="ic">▤</span>Calendar</a>
  <a href="#"><span class="ic">$</span>Invoices</a>
</nav>

<div class="mock-chip">
  Top <a href="/files-top-1.html" class="on">1</a> <a href="/files-top-2.html">2</a> <a href="/files-top-3.html">3</a>
</div>

</body>
</html>
