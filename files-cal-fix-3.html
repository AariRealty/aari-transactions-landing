<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar fix · Mock 3 · Segment right, no Sync button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ffffff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a09a8f;--line:#eae5d6;--red:#a3402f;--serif:Georgia,'Times New Roman',serif;--sans:'Inter',-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;padding:20px 16px 40px}
  .card{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:16px;padding:14px 14px 16px;max-width:720px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .hdr-title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.3px;color:var(--ink);line-height:1.1}
  .seg{display:inline-flex;background:#f4f1ec;border-radius:20px;padding:2px}
  .seg button{border:0;background:transparent;font:600 11px 'Inter',sans-serif;color:#7a756c;padding:6px 12px;border-radius:18px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding:0 2px}
  .nc-title{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-0.2px;color:var(--ink)}
  .nc-count{font-size:10.5px;font-weight:600;letter-spacing:0.4px;color:var(--muted-2)}
  .tiles{display:flex;gap:8px;overflow-x:auto;padding:1px}
  .tiles::-webkit-scrollbar{display:none}
  .tile{flex:0 0 auto;background:transparent;border:0.5px solid rgba(15,15,15,0.10);border-radius:8px;padding:8px 10px;text-decoration:none;color:var(--ink)}
  .tile .d{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-0.2px;line-height:1}
  .tile .ad{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.25;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
  .tile .days{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px;letter-spacing:0.2px}
  .foot-sync{margin-top:18px;padding-top:12px;border-top:1px solid #f3ede0;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
  .foot-sync a{color:var(--ink);text-decoration:none;font-weight:600;letter-spacing:0.3px}
  .foot-sync .last{font-style:italic}
  .foot{margin-top:12px;font-size:11px;color:var(--muted);text-align:center;font-style:italic}
  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<section class="card">
  <div class="top">
    <h2 class="hdr-title">Calendar</h2>
    <div class="seg"><button class="on">Month</button><button>Week</button></div>
  </div>

  <div class="nc-head">
    <span class="nc-title">Next closings</span>
    <span class="nc-count">7 upcoming</span>
  </div>
  <div class="tiles">
    <a class="tile" href="#"><div class="d">Aug 5</div><div class="ad">4700 32nd Ave SW</div><div class="days">11 days</div></a>
    <a class="tile" href="#"><div class="d">Aug 6</div><div class="ad">3815 NW 22nd Ter</div><div class="days">12 days</div></a>
    <a class="tile" href="#"><div class="d">Aug 12</div><div class="ad">1130 NW 14th Ter</div><div class="days">18 days</div></a>
  </div>

  <div class="foot-sync">
    <span class="last">Synced 2 min ago</span>
    <a href="#">Sync now →</a>
  </div>

  <p class="foot">↓ week strip continues below (unchanged)</p>
</section>

<div class="mock-chip">
  Cal fix <a href="/files-cal-fix-1.html">1</a> <a href="/files-cal-fix-2.html">2</a> <a href="/files-cal-fix-3.html" class="on">3</a>
</div>

</body>
</html>
