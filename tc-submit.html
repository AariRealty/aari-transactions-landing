<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit a file · Aari Transactions</title>
<style>
  :root{ --ink:#0f0f0f; --cream:#fbfaf7; --line:rgba(15,15,15,0.14); --muted:#777; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
  .wrap{max-width:600px;margin:0 auto;padding:28px 20px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .eb{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
  h1{font-size:24px;font-weight:500;margin:4px 0 4px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 22px}
  .back{font-size:13px;color:var(--ink);background:#fff;border:0.5px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block}
  .back:hover{background:#f3f1ec}
  .card{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:20px}
  .field{margin-bottom:16px}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
  .req{color:#a32d2d}
  input,select{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:var(--ink)}
  input[type=file]{padding:8px;background:#fafafa}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .submit{width:100%;font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--ink);border:0;border-radius:8px;padding:13px;cursor:pointer;margin-top:6px}
  .submit:hover{background:#2a2a2a}
  .submit:disabled{opacity:.6;cursor:default}
  .status{font-size:12.5px;margin-top:12px;min-height:16px}
  .status.err{color:#a32d2d}
  .status.ok{color:#3b6d11}
  .hide{display:none}
  .gate{text-align:center;padding:40px 20px}
  .gate a{color:var(--ink);font-weight:600}
  /* confirmation */
  .done-h{font-size:22px;font-weight:500;margin:0 0 4px}
  .done-sub{font-size:14px;color:var(--muted);margin:0 0 18px}
  .paylink-row{display:flex;gap:8px;align-items:center;margin:14px 0}
  .paylink-row input{flex:1;min-width:0;background:#fafafa;font-size:13px}
  .copy-btn{font-size:13px;font-weight:600;color:#fff;background:var(--ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;white-space:nowrap}
  .paynote{font-size:12.5px;color:var(--muted);margin:6px 2px 18px}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <p class="eb">Aari Transactions · TC Portal</p>
    <a class="back" href="/files.html">&larr; Back to dashboard</a>
  </div>

  <!-- Loading / auth gate -->
  <div id="gate" class="gate">Checking your session&hellip;</div>

  <!-- Form -->
  <div id="formWrap" class="hide">
    <h1>Submit a file</h1>
    <p class="sub" id="tcName">Submitting as your coordinator.</p>
    <div class="card">
      <div class="field">
        <label for="fService">Service <span class="req">*</span></label>
        <select id="fService"></select>
      </div>
      <div class="field">
        <label for="fAddress">Property address <span class="req">*</span></label>
        <input type="text" id="fAddress" placeholder="1247 SE 14th Pl, Cape Coral, FL">
      </div>
      <div class="row2">
        <div class="field"><label for="fBuyer">Buyer name</label><input type="text" id="fBuyer" placeholder="John Doe"></div>
        <div class="field"><label for="fSeller">Seller name</label><input type="text" id="fSeller" placeholder="Jane Smith"></div>
      </div>
      <div class="field">
        <label for="fAgent">Agent name <span class="req">*</span></label>
        <input type="text" id="fAgent" placeholder="Agent on the file">
      </div>
      <div class="row2">
        <div class="field"><label for="fEffective">Effective date</label><input type="date" id="fEffective"></div>
        <div class="field"><label for="fClosing">Closing date</label><input type="date" id="fClosing"></div>
      </div>
      <div class="field">
        <label for="fContract">Executed contract (PDF) <span class="req">*</span></label>
        <input type="file" id="fContract" accept="application/pdf,image/*">
      </div>
      <div class="field">
        <label for="fDocs">Additional documents</label>
        <input type="file" id="fDocs" accept="application/pdf,image/*" multiple>
      </div>
      <button type="button" class="submit" id="btnSubmit">Submit file</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- Confirmation -->
  <div id="doneWrap" class="hide">
    <div class="card">
      <p class="done-h">File submitted.</p>
      <p class="done-sub">Send this payment link to your agent.</p>
      <div id="payRow" class="paylink-row">
        <input type="text" id="payLink" readonly>
        <button type="button" class="copy-btn" id="copyBtn">Copy link</button>
      </div>
      <p class="paynote" id="payNote"></p>
      <a class="submit" href="/files.html" style="display:block;text-align:center;text-decoration:none">Back to the board &rarr;</a>
    </div>
  </div>

</div>

<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
(function(){
  'use strict';
  // Service catalog · mirrors the SERVICES list in index.html (same Stripe links).
  var SERVICES = [
    { id:'tc_one_side',  name:'Transaction Coordination · One Side',  price:399, file_type:'sale',    stripe:null, meta:'Billed at closing via CDA' },
    { id:'tc_both_sides',name:'Transaction Coordination · Both Sides', price:599, file_type:'sale',    stripe:null, meta:'Billed at closing via CDA' },
    { id:'lc',           name:'Listing Coordinator',                   price:199, file_type:'listing', stripe:'https://buy.stripe.com/dRm3cn77V6in5Cj9QScAo0h', meta:'Pay upfront via Stripe' },
    { id:'op_basic',     name:'Offer Prep · Basic',                    price:69,  file_type:'sale',    stripe:'https://buy.stripe.com/3cI5kv63R227ggXbZ0cAo07', meta:'Pay upfront via Stripe' },
    { id:'op_complete',  name:'Offer Prep · Complete',                 price:149, file_type:'sale',    stripe:'https://buy.stripe.com/6oUfZ99g3gX18Ov4wycAo05', meta:'Pay upfront via Stripe' },
    { id:'listing_docs', name:'Listing Docs',                          price:99,  file_type:'listing', stripe:'https://buy.stripe.com/6oU7sD8bZbCH3ubfbccAo08', meta:'Pay upfront via Stripe' },
    { id:'mls_setup',    name:'MLS Setup',                             price:149, file_type:'listing', stripe:'https://buy.stripe.com/fZu5kvgIvbCH7Kr7IKcAo09', meta:'Pay upfront via Stripe' },
    { id:'file_org',     name:'File Organization',                     price:99,  file_type:'sale',    stripe:'https://buy.stripe.com/6oU00b2RF6infcT8MOcAo0f', meta:'Pay upfront via Stripe' }
  ];
  var SVC_BY_ID = {}; SERVICES.forEach(function(s){ SVC_BY_ID[s.id] = s; });

  var $ = function(id){ return document.getElementById(id); };
  var client = null, uid = null, profile = null;

  function showGate(html){ $('gate').innerHTML = html; $('gate').classList.remove('hide'); $('formWrap').classList.add('hide'); }

  async function boot(){
    try {
      if(!(window.AariAuth && window.AariAuth.ensureClient)){ showGate('Auth not available. <a href="/login.html">Sign in</a>.'); return; }
      client = await window.AariAuth.ensureClient();
      var sess = null;
      try { sess = await window.AariAuth.getCurrentSession(); } catch(_){}
      var ur = await client.auth.getUser();
      uid = ur && ur.data && ur.data.user && ur.data.user.id;
      if(!uid){ showGate('Please <a href="/login.html?next=/tc-submit.html">sign in</a> to submit a file.'); return; }
      try { profile = await window.AariAuth.getAgentProfile(); } catch(_){ profile = null; }
      var nm = profile ? ([profile.first_name, profile.last_name].filter(Boolean).join(' ')) : '';
      $('tcName').textContent = nm ? ('Submitting as ' + nm + '.') : 'Submitting as your coordinator.';
      // Populate the service dropdown.
      $('fService').innerHTML = '<option value="">— pick a service —</option>' +
        SERVICES.map(function(s){ return '<option value="'+s.id+'">'+s.name+' · $'+s.price+'</option>'; }).join('');
      $('gate').classList.add('hide');
      $('formWrap').classList.remove('hide');
    } catch(err){
      showGate('Something went wrong loading the form. <a href="/login.html">Sign in</a> and try again.');
    }
  }

  function setStatus(msg, kind){ var s = $('status'); s.textContent = msg || ''; s.className = 'status' + (kind ? ' ' + kind : ''); }

  async function submitFile(){
    var btn = $('btnSubmit');
    var svcId = $('fService').value;
    var address = $('fAddress').value.trim();
    var agent = $('fAgent').value.trim();
    var contractFile = $('fContract').files && $('fContract').files[0];
    if(!svcId){ setStatus('Pick a service.', 'err'); return; }
    if(!address){ setStatus('Property address is required.', 'err'); return; }
    if(!agent){ setStatus('Agent name is required.', 'err'); return; }
    if(!contractFile){ setStatus('Attach the executed contract.', 'err'); return; }
    var svc = SVC_BY_ID[svcId];
    btn.disabled = true; setStatus('Uploading contract…');
    try {
      var subId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sub-' + Date.now());
      var safeName = (contractFile.name || 'contract.pdf').replace(/[^a-zA-Z0-9._-]/g, '_');
      var path = uid + '/' + subId + '/' + safeName;
      var up = await client.storage.from('transaction-files').upload(path, contractFile, { upsert:false, contentType: contractFile.type || 'application/octet-stream' });
      if(up && up.error) throw new Error('Contract upload failed · ' + up.error.message);
      var urlData = await client.storage.from('transaction-files').createSignedUrl(path, 604800);
      var contractUrl = (urlData && urlData.data && urlData.data.signedUrl) || '';

      // Additional docs (optional).
      var addl = [];
      var docs = $('fDocs').files;
      if(docs && docs.length){
        setStatus('Uploading documents…');
        for(var i=0; i<Math.min(docs.length,5); i++){
          var f = docs[i];
          var dn = (f.name || ('doc'+i)).replace(/[^a-zA-Z0-9._-]/g, '_');
          var dp = uid + '/' + subId + '/additional/' + dn;
          try {
            var du = await client.storage.from('transaction-files').upload(dp, f, { upsert:false, contentType: f.type || 'application/octet-stream' });
            if(!(du && du.error)) addl.push({ filename: dn, path: dp });
          } catch(_){}
        }
      }

      setStatus('Filing the transaction…');
      var buyer = $('fBuyer').value.trim();
      var seller = $('fSeller').value.trim();
      var row = {
        id: subId,
        agent_id: uid,
        service_type: svcId,
        file_type: svc.file_type || 'sale',
        client_type: buyer ? 'Buyer' : (seller ? 'Seller' : null),
        client_name: buyer || seller || '',
        property_address: address,
        effective_date: $('fEffective').value || null,
        closing_date: $('fClosing').value || null,
        assigned_tc_id: uid,
        is_aari_engaged: true,
        status: 'intake_received',
        transaction_stage: 'new', // explicit from creation → deriveStage never hits the date fallback
        raw_form_data: {
          submitted_by_tc: true,
          tc_submitter_id: uid,
          buyer_name: buyer, seller_name: seller, agent_name: agent,
          contract_url: contractUrl, contract_filename: safeName, contract_path: path,
          additional_docs: addl, submission_id: subId
        }
      };
      var ins = await client.from('files').insert(row).select('id').single();
      if(ins && ins.error) throw new Error(ins.error.message);

      // Confirmation screen.
      $('formWrap').classList.add('hide');
      var link = svc.stripe || '';
      if(link){
        $('payLink').value = link;
        $('payRow').style.display = 'flex';
        $('payNote').textContent = svc.name + ' · $' + svc.price;
        $('copyBtn').onclick = function(){
          try { navigator.clipboard.writeText(link); } catch(_){}
          var o = $('copyBtn').textContent; $('copyBtn').textContent = '✓ Copied'; setTimeout(function(){ $('copyBtn').textContent = o; }, 1400);
        };
      } else {
        $('payRow').style.display = 'none';
        $('payNote').textContent = (svc.meta || 'Billed at closing via CDA') + ' — no upfront payment link for this service.';
      }
      $('doneWrap').classList.remove('hide');
      window.scrollTo(0,0);
    } catch(err){
      btn.disabled = false;
      var _msg = (err && err.message) ? err.message : 'try again.';
      setStatus('Could not submit · ' + _msg, 'err');
      // Loud failure · a TC submitting on behalf of a client must never see
      // "nothing happen" — surface the real reason so it can't be missed.
      alert('This file did NOT submit and nothing was sent.\n\nReason: ' + _msg + '\n\nTry again. If it keeps happening, send this exact message to support.');
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    $('btnSubmit').addEventListener('click', submitFile);
    boot();
  });
})();
</script>
</body>
</html>
