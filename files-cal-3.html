<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Cal Mock 3 · Focus week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ffffff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--sage:#a4b8a6;--gold:#8a6a1f;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
  .nav{position:sticky;top:0;z-index:90;background:rgba(251,249,244,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
  .nav-wrap{max-width:720px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{height:40px;width:auto;display:block}
  .brand .name{font-weight:700;font-size:14px;letter-spacing:-0.01em}
  .brand .name small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-top:2px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none}
  main{max-width:720px;margin:0 auto;padding:20px 16px 40px}

  /* CAL MOCK 3 · FOCUS WEEK · big week strip is the star, closings above as strip, month toggle hidden by default */
  .cal-title-row{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 12px;gap:10px}
  .cal-title{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-0.3px}
  .cal-mini{display:flex;gap:8px;align-items:center}
  .cal-mini .sync{background:transparent;border:0;color:var(--muted);font:600 11px 'Inter',sans-serif;letter-spacing:.3px;cursor:pointer;padding:8px 4px}
  .cal-mini .sync:hover{color:var(--ink)}

  /* Slim closings strip · replaces the boxy card */
  .closings-strip{padding:0 4px 12px}
  .cs-eb{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .cs-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0 2px}
  .cs-row::-webkit-scrollbar{display:none}
  .cs-pill{flex:0 0 auto;background:#fff;border:0.5px solid rgba(15,15,15,0.14);border-radius:999px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);min-height:38px}
  .cs-pill .d{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:-0.2px;line-height:1}
  .cs-pill .ad{font-size:12px;color:var(--ink-2);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .cs-pill .days{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0.3px;background:#faf7ef;padding:2px 6px;border-radius:999px}

  /* BIG week grid · dominates the section */
  .week-range{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0.3px}
  .week-range .nav{display:flex;gap:6px}
  .week-range .nav button{width:34px;height:34px;border-radius:8px;background:#fff;border:0.5px solid rgba(15,15,15,0.14);color:var(--ink);cursor:pointer;font-size:14px}
  .wk-big{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
  .wk-day{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:14px;padding:14px 4px 12px;text-align:center;position:relative;min-height:96px;cursor:pointer;transition:transform .1s ease}
  .wk-day:active{transform:scale(.97)}
  .wk-day.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .wk-day .w{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;display:block}
  .wk-day.on .w{color:rgba(255,255,255,0.65)}
  .wk-day .n{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1;letter-spacing:-0.4px;margin-top:4px;display:block}
  .wk-day .badge{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .wk-day.on .badge{background:#fff;color:var(--ink)}

  /* Selected day peek · shows what's on the chosen day, right below */
  .sel-peek{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:12px;padding:14px 16px}
  .sel-peek-eb{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .sel-peek-h{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-0.2px;margin-bottom:12px}
  .sp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:0.5px solid #f3ede0;font-size:13px}
  .sp-row:first-of-type{border-top:0}
  .sp-row .tag{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#fdecea;color:var(--red)}
  .sp-row .body{flex:1}
  .sp-row .body b{display:block;font-weight:600}
  .sp-row .body span{color:var(--muted);font-size:11.5px;display:block;margin-top:1px}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a class="brand" href="/portal"><img src="images/aari-logo.png" alt="Aari Transactions"><span class="name">Aari Transactions<small>Florida TC</small></span></a>
    <a class="av" href="/portal">M</a>
  </div>
</nav>

<main>
  <div class="cal-title-row">
    <h2 class="cal-title">This week</h2>
    <div class="cal-mini">
      <button class="sync">📅 Sync</button>
      <button class="sync">Month view →</button>
    </div>
  </div>

  <div class="closings-strip">
    <div class="cs-eb">Closings ahead</div>
    <div class="cs-row">
      <a class="cs-pill" href="#"><span class="d">Aug 5</span><span class="ad">4700 32nd Ave SW</span><span class="days">11 d</span></a>
      <a class="cs-pill" href="#"><span class="d">Aug 6</span><span class="ad">3815 NW 22nd Ter</span><span class="days">12 d</span></a>
      <a class="cs-pill" href="#"><span class="d">Aug 12</span><span class="ad">1130 NW 14th Ter</span><span class="days">18 d</span></a>
    </div>
  </div>

  <div class="week-range">
    <span>Jul 19 – Jul 25</span>
    <div class="nav"><button>‹</button><button>›</button></div>
  </div>

  <div class="wk-big">
    <div class="wk-day"><span class="w">S</span><span class="n">19</span></div>
    <div class="wk-day"><span class="w">M</span><span class="n">20</span><span class="badge">7</span></div>
    <div class="wk-day"><span class="w">T</span><span class="n">21</span></div>
    <div class="wk-day"><span class="w">W</span><span class="n">22</span><span class="badge">2</span></div>
    <div class="wk-day"><span class="w">T</span><span class="n">23</span><span class="badge">1</span></div>
    <div class="wk-day"><span class="w">F</span><span class="n">24</span><span class="badge">1</span></div>
    <div class="wk-day on"><span class="w">S</span><span class="n">25</span><span class="badge">1</span></div>
  </div>

  <div class="sel-peek">
    <div class="sel-peek-eb">Today · Sat, Jul 25</div>
    <div class="sel-peek-h">1 item on your plate</div>
    <div class="sp-row">
      <span class="tag">Due</span>
      <div class="body"><b>Inspection check-in</b><span>1130 NW 14th Ter · on track or extend?</span></div>
    </div>
  </div>
</main>

<div class="mock-chip">
  Cal <a href="/files-cal-1.html">1</a> <a href="/files-cal-2.html">2</a> <a href="/files-cal-3.html" class="on">3</a>
</div>

</body>
</html>
