<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board · Mock 3 · Funnel + drill-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--green:#3e7d57;--sans:'Inter',-apple-system,sans-serif;--serif:Georgia,'Times New Roman',serif;--playfair:'Playfair Display',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;padding:16px 16px 90px}

  /* MOCK 3 · FUNNEL VIEW · pipeline as a horizontal bar chart
     Each stage is a bar sized by count. See the whole distribution
     visually at a glance ("most files are in MLS Setup"), tap a bar
     to drill into that stage's files. Combines pipeline visibility
     (chart) with drill-down (list). Broker-oriented.                       */

  .hdr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .hdr .title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.3px}
  .hdr .ct{font-family:var(--playfair);font-size:15px;font-weight:500;color:var(--muted)}

  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.4}
  .sub b{color:var(--red);font-weight:700}

  .search{position:relative;margin-bottom:10px}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:100%;background:#fff;border:0.5px solid rgba(15,15,15,0.16);border-radius:10px;padding:10px 12px 10px 36px;font-size:16px;font-family:inherit;outline:none;min-height:42px}

  .seg{display:inline-flex;background:#f4f1ec;border-radius:20px;padding:2px;margin-bottom:16px}
  .seg button{border:0;background:transparent;font:600 11px 'Inter',sans-serif;color:#7a756c;padding:6px 14px;border-radius:18px;cursor:pointer;min-height:32px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* Funnel · one row per stage · bar width proportional to count */
  .funnel{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:14px;padding:14px 14px 10px;margin-bottom:16px}
  .funnel .eb{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
  .fbar{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:0.5px solid #f3ede0;cursor:pointer}
  .fbar:first-of-type{border-top:0}
  .fbar .lbl{font-size:11px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:0.4px;line-height:1.2}
  .fbar .track{height:12px;background:#f4f1ec;border-radius:6px;overflow:hidden;position:relative}
  .fbar .fill{height:100%;background:var(--ink);border-radius:6px;transition:width .3s ease}
  .fbar.warn .fill{background:var(--red)}
  .fbar .n{font-family:var(--playfair);font-size:16px;font-weight:500;color:var(--ink);letter-spacing:-0.3px;min-width:20px;text-align:right}
  .fbar.warn .n{color:var(--red)}
  .fbar.attn .lbl::before{content:'●';color:var(--red);margin-right:5px;font-size:9px;vertical-align:1px}

  /* Drill-in · files in the selected stage */
  .drill-hd{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px}
  .drill-hd .lbl{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .drill-hd .ct{font-family:var(--playfair);font-size:15px;font-weight:500;color:var(--ink)}
  .list{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:0.5px solid #f3ede0;cursor:pointer;min-height:56px}
  .row:first-child{border-top:0}
  .row .body{flex:1;min-width:0}
  .row .a{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .row .m{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .r{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:0.2px;flex:none}
  .row .r.warn{color:var(--red)}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<div class="hdr">
  <h2 class="title">Board</h2>
  <span class="ct">22 active</span>
</div>
<div class="sub"><b>2 need you</b> · 5 under contract · 15 listings</div>

<div class="search">
  <span class="ic">🔍</span>
  <input placeholder="Search address, client, agent…">
</div>

<div class="seg"><button class="on">All 22</button><button>Sales 7</button><button>Listings 15</button></div>

<div class="funnel">
  <div class="eb">Distribution · tap a bar to drill in</div>
  <div class="fbar warn attn"><span class="lbl">Needs you</span><div class="track"><div class="fill" style="width:9%"></div></div><span class="n">2</span></div>
  <div class="fbar"><span class="lbl">New</span><div class="track"><div class="fill" style="width:0%"></div></div><span class="n">0</span></div>
  <div class="fbar"><span class="lbl">Under contract</span><div class="track"><div class="fill" style="width:23%"></div></div><span class="n">5</span></div>
  <div class="fbar"><span class="lbl">Pending</span><div class="track"><div class="fill" style="width:5%"></div></div><span class="n">1</span></div>
  <div class="fbar"><span class="lbl">MLS Setup</span><div class="track"><div class="fill" style="width:68%"></div></div><span class="n">15</span></div>
  <div class="fbar"><span class="lbl">Closed YTD</span><div class="track"><div class="fill" style="width:27%"></div></div><span class="n">6</span></div>
</div>

<div class="drill-hd"><span class="lbl">Needs you</span><span class="ct">2</span></div>
<div class="list">
  <div class="row"><div class="body"><div class="a">3815 NW 22nd Ter</div><div class="m">Milennys · inspection missed</div></div><span class="r warn">1d late</span></div>
  <div class="row"><div class="body"><div class="a">4700 32nd Ave SW</div><div class="m">Milennys · escrow deposit</div></div><span class="r warn">today</span></div>
</div>

<div class="mock-chip">
  Board <a href="/files-board-1.html">1</a> <a href="/files-board-2.html">2</a> <a href="/files-board-3.html" class="on">3</a>
</div>

</body>
</html>
