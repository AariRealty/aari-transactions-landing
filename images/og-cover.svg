<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aari Transactions · Open Graph social share image
  Spec: 1200 × 630 (Facebook, LinkedIn, Twitter standard)
  Save as og-cover.jpg or use this SVG directly.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Aari Transactions · Florida Transaction Coordination">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf6"/>
      <stop offset="100%" stop-color="#f4f0e4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative giant A watermark · low opacity -->
  <text x="1100" y="640"
        font-family="Georgia, 'Cormorant Garamond', serif"
        font-size="900"
        font-weight="600"
        fill="#0f0f0f"
        opacity="0.04"
        text-anchor="end"
        letter-spacing="-30">A</text>

  <!-- Gold accent bar · top left -->
  <rect x="80" y="80" width="60" height="3" fill="#b89968"/>

  <!-- Eyebrow · top left, above wordmark -->
  <text x="80" y="118"
        font-family="Inter, -apple-system, sans-serif"
        font-size="16"
        font-weight="700"
        fill="#b89968"
        letter-spacing="2.8">FLORIDA TC · BROKER-OWNED</text>

  <!-- AARI wordmark box -->
  <rect x="80" y="155" width="160" height="80" rx="10" fill="none" stroke="#0f0f0f" stroke-width="3"/>
  <text x="160" y="217"
        font-family="Georgia, 'Cormorant Garamond', serif"
        font-size="58"
        font-weight="600"
        fill="#0f0f0f"
        text-anchor="middle"
        letter-spacing="6">AARI</text>

  <!-- Headline · big serif -->
  <text x="80" y="340"
        font-family="Georgia, 'Cormorant Garamond', serif"
        font-size="84"
        font-weight="500"
        fill="#0f0f0f"
        letter-spacing="-2">Compliance first.</text>
  <text x="80" y="425"
        font-family="Georgia, 'Cormorant Garamond', serif"
        font-size="84"
        font-style="italic"
        font-weight="500"
        fill="#0f0f0f"
        letter-spacing="-2">Deadlines tracked.</text>
  <text x="80" y="510"
        font-family="Georgia, 'Cormorant Garamond', serif"
        font-size="84"
        font-weight="500"
        fill="#0f0f0f"
        letter-spacing="-2">Clean handoffs.</text>

  <!-- Bottom strip · trust signals -->
  <line x1="80" y1="558" x2="1120" y2="558" stroke="#e6e2d8" stroke-width="1"/>

  <text x="80" y="595"
        font-family="Inter, -apple-system, sans-serif"
        font-size="20"
        font-weight="600"
        fill="#0f0f0f">aaritransactions.com</text>


</svg>
