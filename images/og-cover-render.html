<!doctype html>
<!--
  ============================================================================
  Aari Transactions · OG cover render page
  ============================================================================
  Use this page to generate og-cover.jpg or og-cover.png for social previews.

  HOW TO EXPORT:
  1. Open this file in Chrome.
  2. Open DevTools (F12) → Device Toolbar (Cmd+Shift+M / Ctrl+Shift+M).
  3. Set custom dimensions: 1200 × 630.
  4. Right-click the page → "Capture screenshot" (or Cmd+Shift+P → screenshot).
  5. Save as og-cover.jpg (or .png) in the /images folder.

  OR programmatically:
    npx playwright screenshot --viewport-size=1200,630 \
      og-cover-render.html og-cover.png

  This file is dev-only. Should NOT be deployed to production.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG Cover Render · Aari Transactions</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #555; }
  .frame {
    width: 1200px;
    height: 630px;
    margin: 0 auto;
    position: relative;
    background: linear-gradient(135deg, #fafaf6 0%, #f4f0e4 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  /* Giant A watermark · low opacity */
  .watermark {
    position: absolute;
    right: -40px;
    bottom: -180px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 900px;
    font-weight: 600;
    color: #0f0f0f;
    opacity: 0.04;
    line-height: 1;
    letter-spacing: -30px;
    user-select: none;
    pointer-events: none;
  }

  /* Top-left gold accent line + eyebrow */
  .accent { position: absolute; top: 80px; left: 80px; width: 60px; height: 3px; background: #b89968; }
  .eyebrow {
    position: absolute; top: 100px; left: 80px;
    font-size: 16px; font-weight: 700;
    color: #b89968; letter-spacing: 2.8px;
  }

  /* AARI wordmark box */
  .wordmark {
    position: absolute; top: 155px; left: 80px;
    width: 160px; height: 80px;
    border: 3px solid #0f0f0f; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 58px; font-weight: 600;
    color: #0f0f0f; letter-spacing: 6px;
  }

  /* Big serif headline · three lines */
  .headline {
    position: absolute; top: 280px; left: 80px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 84px; font-weight: 500;
    color: #0f0f0f; line-height: 1.02;
    letter-spacing: -2px;
  }
  .headline .italic { font-style: italic; }

  /* Bottom strip */
  .strip { position: absolute; bottom: 72px; left: 80px; right: 80px; border-top: 1px solid #e6e2d8; }
  .url {
    position: absolute; bottom: 38px; left: 80px;
    font-size: 20px; font-weight: 600; color: #0f0f0f;
  }
  .broker {
    position: absolute; bottom: 38px; right: 80px;
    font-size: 18px; font-weight: 500; color: #6b6b6b;
  }
</style>
</head>
<body>

<div class="frame">
  <span class="watermark">A</span>

  <span class="accent"></span>
  <p class="eyebrow">FLORIDA TC &middot; BROKER-OWNED</p>

  <div class="wordmark">AARI</div>

  <div class="headline">
    Compliance first.<br>
    <span class="italic">Deadlines tracked.</span><br>
    Clean handoffs.
  </div>

  <div class="strip"></div>
  <p class="url">aaritransactions.com</p>
  <p class="broker">Florida Broker &middot; Marlenyi Paredes &middot; BK3530153</p>
</div>

</body>
</html>
