<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock 1 · Editorial · Aari Transactions Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --cream:#faf7ef;
    --ink:#0a0a0a;
    --ink-2:#3d3a34;
    --muted:#7a756c;
    --line:#eae5d6;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  /* Homepage nav */
  .nav{position:sticky;top:0;z-index:90;background:rgba(251,249,244,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
  .nav-wrap{max-width:720px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{height:40px;width:auto;display:block}
  .brand .name{font-weight:700;font-size:14px;letter-spacing:-0.01em}
  .brand .name small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-top:2px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none}

  /* EDITORIAL HERO — magazine-cover feel */
  .ed-hero{padding:44px 22px 12px;max-width:720px;margin:0 auto}
  .ed-date{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  .ed-h{font-family:var(--serif);font-weight:600;font-size:64px;line-height:0.95;letter-spacing:-1.2px;color:var(--ink)}
  .ed-h em{font-style:italic;font-weight:500;color:var(--ink-2)}
  .ed-sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);margin-top:14px;line-height:1.4}

  .ed-rule{max-width:720px;margin:34px auto 0;border-top:1px solid var(--line)}

  /* Tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:24px 20px 8px;max-width:720px;margin:0 auto}
  .tile{display:flex;flex-direction:column;justify-content:space-between;gap:22px;padding:22px 20px;background:var(--cream);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--ink);min-height:150px}
  .tile.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tile svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.5}
  .tile-foot{display:flex;justify-content:space-between;align-items:flex-end}
  .tile .n{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.4px;line-height:1.1}
  .tile .arr{font-size:22px;line-height:1;color:currentColor;opacity:.55}

  /* Everything else link */
  .more-link{display:block;text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted);text-decoration:none;padding:26px 20px 40px;letter-spacing:0.2px}
  .more-link:hover{color:var(--ink)}

  /* Preview chip */
  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a class="brand" href="/portal">
      <img src="images/aari-logo.png" alt="Aari Transactions">
      <span class="name">Aari Transactions<small>Florida TC</small></span>
    </a>
    <a class="av" href="/portal">M</a>
  </div>
</nav>

<section class="ed-hero">
  <div class="ed-date">Saturday, July 25 · Home</div>
  <h1 class="ed-h">Home,<br><em>Marlenyi.</em></h1>
  <p class="ed-sub">Nothing urgent flagged. Move a file, check on an agent, or take the afternoon.</p>
</section>

<div class="ed-rule"></div>

<div class="tiles">
  <a class="tile ink" href="/files.html">
    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    <div class="tile-foot"><span class="n">Move<br>the files</span><span class="arr">›</span></div>
  </a>
  <a class="tile" href="/aari-agent-crm.html">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <div class="tile-foot"><span class="n">Agent<br>Portal</span><span class="arr">›</span></div>
  </a>
</div>

<a class="more-link" href="#">Everything else →</a>

<div class="mock-chip">
  Mock <a href="/home-mock-1.html" class="on">1</a> <a href="/home-mock-2.html">2</a> <a href="/home-mock-3.html">3</a>
</div>

</body>
</html>
