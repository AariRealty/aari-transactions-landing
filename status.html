<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your transaction · Aari Transactions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0f0f0f;--muted:#6b6862;--faint:#9a958c;--cream:#faf7f0;--line:rgba(15,15,15,0.10);--soft:rgba(15,15,15,0.06);--sage:#5a9e72;--sage-bg:#e8f5ed;--sage-bd:#a8d5b5}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:#efece6;line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
  .frame{max-width:460px;margin:0 auto;min-height:100vh;background:#fff}
  .cap{background:#0f0f0f;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:11px}
  .cap .logo{width:30px;height:30px;border-radius:7px;background:#fff;color:#0f0f0f;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
  .cap .w{font-size:12px;color:#c9c4ba;line-height:1.3}.cap .w b{color:#fff;font-weight:600;display:block;font-size:13.5px}
  .cb{padding:22px 20px 36px}
  .addr{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:500;line-height:1.25;letter-spacing:-0.3px}
  .greet{font-size:13px;color:var(--muted);margin-top:5px;margin-bottom:20px}
  .steps{margin-bottom:6px}
  .step{display:flex;align-items:flex-start;gap:13px;padding:10px 0}
  .step .dot{width:18px;height:18px;border-radius:50%;border:2px solid #d4d2cc;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .step.done .dot{background:#0f0f0f;border-color:#0f0f0f}
  .step.now .dot{border-color:#0f0f0f;box-shadow:0 0 0 4px rgba(15,15,15,.09)}
  .step .t{font-size:13.5px;font-weight:500}.step.future .t{color:var(--faint);font-weight:400}
  .step .s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .nextcard{background:var(--cream);border:0.5px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0 18px}
  .nextcard .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
  .nextcard .m{font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:500;margin-top:4px;line-height:1.3}
  .ontrack{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;margin-top:8px}
  .ontrack.ok{background:var(--sage-bg);border:0.5px solid var(--sage-bd);color:var(--sage)}
  .ontrack.watch{background:#fdf6e3;border:0.5px solid #f0d89a;color:#9a7c3a}
  .agent{display:flex;gap:12px;align-items:center;border-top:0.5px solid var(--line);margin-top:18px;padding-top:16px}
  .agent .ava{width:40px;height:40px;border-radius:50%;background:#0f0f0f;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
  .agent .n{font-size:13.5px;font-weight:600}.agent .c{font-size:12px;color:var(--muted)}
  .agent a.call{margin-left:auto;background:#0f0f0f;color:#fff;font-size:12px;font-weight:600;padding:9px 14px;border-radius:8px;text-decoration:none;white-space:nowrap}
  .foot{font-size:10.5px;color:var(--faint);text-align:center;margin-top:20px;line-height:1.5}
  .state{padding:60px 24px;text-align:center}
  .state h2{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:500;margin-bottom:8px}
  .state p{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="state"><p>Loading…</p></div>
</div>

<script src="/js/supabase-config.js?v=30"></script>
<script>
(function(){
  'use strict';
  var cfg = window.AARI_SUPABASE_CONFIG || {};
  var frame = document.getElementById('frame');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function initials(name){ var p=(name||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
  function fmtDate(d){ if(!d) return ''; try{ return new Date(/T/.test(d)?d:(d+'T00:00:00')).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(_){ return ''; } }

  function showState(title, msg){
    frame.innerHTML = '<div class="cap"><div class="logo">A</div><div class="w">Aari Transactions<b>Transaction status</b></div></div>' +
      '<div class="state"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div>';
  }

  function render(d){
    var agentName = (d.agent && d.agent.name) || 'Your agent';
    var phone = (d.agent && d.agent.phone) || '';
    var firstName = agentName.split(' ')[0] || 'there';
    var steps = (d.milestones || []).map(function(m){
      var icon = m.state === 'done' ? '&#10003;' : '';
      var sub = m.date ? '<div class="s">' + (m.state==='done'?'':'') + esc(fmtDate(m.date)) + '</div>' : (m.state==='now' ? '<div class="s">In progress</div>' : '');
      return '<div class="step '+m.state+'"><div class="dot">'+icon+'</div><div><div class="t">'+esc(m.label)+'</div>'+sub+'</div></div>';
    }).join('');

    var nextLine = '';
    if(d.next && d.next.date){ nextLine = 'Next update expected around ' + esc(fmtDate(d.next.date)); }
    else if(d.closing_date){ nextLine = 'Closing scheduled for ' + esc(fmtDate(d.closing_date)); }
    else { nextLine = 'Your agent will share the next date soon.'; }

    var track = d.on_track
      ? '<span class="ontrack ok">&#10003; On track</span>'
      : '<span class="ontrack watch">In progress</span>';

    var callBtn = phone ? '<a class="call" href="tel:'+esc(phone.replace(/[^0-9+]/g,''))+'">Call</a>' : '';

    frame.innerHTML =
      '<div class="cap"><div class="logo">A</div><div class="w">Your transaction with<b>'+esc(agentName)+'</b></div></div>' +
      '<div class="cb">' +
        '<div class="addr">'+esc(d.property_address || 'Your transaction')+'</div>' +
        '<div class="greet">Hi — here’s where things stand. Your agent and the Aari team are handling the details.</div>' +
        '<div class="steps">'+steps+'</div>' +
        '<div class="nextcard"><div class="k">Next up</div><div class="m">'+nextLine+'</div>'+track+'</div>' +
        '<div class="agent"><div class="ava">'+esc(initials(agentName).toUpperCase())+'</div><div><div class="n">'+esc(agentName)+'</div><div class="c">Your agent'+(phone?' · '+esc(phone):'')+'</div></div>'+callBtn+'</div>' +
        '<div class="foot">Coordinated by Aari Transactions on behalf of your agent.<br>This is a read-only status page.</div>' +
      '</div>';
  }

  var token = new URLSearchParams(window.location.search).get('token') || (location.pathname.split('/status/')[1] || '');
  if(!token){ showState('Link not found', 'This status link looks incomplete. Ask your agent to resend it.'); return; }
  if(!cfg.SUPABASE_URL){ showState('Unavailable', 'Status is temporarily unavailable. Please try again shortly.'); return; }

  fetch(cfg.SUPABASE_URL + '/functions/v1/client-status?token=' + encodeURIComponent(token), {
    headers: { 'apikey': cfg.SUPABASE_ANON_KEY || '', 'Authorization': 'Bearer ' + (cfg.SUPABASE_ANON_KEY || '') }
  })
  .then(function(r){ return r.json().catch(function(){ return { ok:false }; }); })
  .then(function(d){
    if(!d || !d.ok){
      if(d && d.expired) return showState('This link has expired', 'Your transaction has wrapped up, or the link timed out. Ask your agent for an update.');
      return showState('Link not found', 'This status link isn’t valid. Ask your agent to resend it.');
    }
    render(d);
  })
  .catch(function(){ showState('Unavailable', 'Status is temporarily unavailable. Please try again shortly.'); });
})();
</script>
</body>
</html>
