<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overdue · Mock 3 · Top 3 + collapse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ffffff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a09a8f;--line:#eae5d6;--red:#a3402f;--serif:Georgia,'Times New Roman',serif;--sans:'Inter',-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;padding:20px 16px 40px}
  .card{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:16px;padding:16px 14px 12px;max-width:720px;margin:0 auto}

  .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .hero-l{flex:1}
  .hero-eb{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
  .hero-h{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.15;letter-spacing:-0.2px;color:var(--ink)}
  .hero-h .num{color:var(--red)}
  .hero-h em{font-style:italic;color:var(--ink-2)}
  .clear-all{flex:none;background:var(--red);color:#fff;border:0;padding:8px 14px;border-radius:10px;font:600 11.5px 'Inter',sans-serif;letter-spacing:0.3px;cursor:pointer;min-height:36px;white-space:nowrap}

  .task{background:#faf7ef;border:0.5px solid rgba(15,15,15,0.08);border-radius:12px;padding:12px 14px;margin-top:10px;position:relative}
  .task .lbl{font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin-bottom:4px}
  .task .n{font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
  .task .ad{font-size:11.5px;color:var(--muted);margin-top:2px}
  .task .actions{display:flex;gap:8px;margin-top:10px}
  .task .btn{flex:1;padding:9px;border-radius:8px;background:#fff;border:0.5px solid rgba(15,15,15,0.15);font:600 11.5px 'Inter',sans-serif;color:var(--ink);cursor:pointer;min-height:36px}
  .task .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}

  .see-more{display:block;width:100%;text-align:center;padding:14px 0 4px;background:transparent;border:0;color:var(--muted);font:600 11.5px 'Inter',sans-serif;letter-spacing:0.4px;text-transform:uppercase;cursor:pointer;margin-top:6px;border-top:0.5px solid #f3ede0}
  .see-more:hover{color:var(--ink)}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<section class="card">
  <div class="hero">
    <div class="hero-l">
      <div class="hero-eb">Overdue · needs you</div>
      <div class="hero-h"><span class="num">20</span> deadlines past due, <em>oldest 12 days.</em></div>
    </div>
    <button class="clear-all">Clear all</button>
  </div>

  <div class="task">
    <div class="lbl">12 days late</div>
    <div class="n">Inspection Period Ends</div>
    <div class="ad">3815 NW 22nd Ter · Milennys</div>
    <div class="actions">
      <button class="btn primary">Mark done</button>
      <button class="btn">Open file</button>
    </div>
  </div>

  <div class="task">
    <div class="lbl">12 days late</div>
    <div class="n">Title Evidence Deadline</div>
    <div class="ad">3815 NW 22nd Ter · Milennys</div>
    <div class="actions">
      <button class="btn primary">Mark done</button>
      <button class="btn">Open file</button>
    </div>
  </div>

  <div class="task">
    <div class="lbl">10 days late</div>
    <div class="n">Initial Deposit Deadline</div>
    <div class="ad">12643 Kinross Ln · Marlenyi</div>
    <div class="actions">
      <button class="btn primary">Mark done</button>
      <button class="btn">Open file</button>
    </div>
  </div>

  <button class="see-more">Show 17 more overdue ↓</button>
</section>

<div class="mock-chip">
  Overdue <a href="/files-overdue-1.html">1</a> <a href="/files-overdue-2.html">2</a> <a href="/files-overdue-3.html" class="on">3</a>
</div>

</body>
</html>
