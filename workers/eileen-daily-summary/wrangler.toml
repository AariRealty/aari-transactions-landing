name = "aari-eileen-daily-summary"
main = "src/index.js"
compatibility_date = "2026-05-26"

# Cron · 6:00 PM Eastern · weekdays only.
# Eastern Daylight Time = UTC-4 → 22:00 UTC.
# NOTE: standard time (EST = UTC-5) shifts the local-time delivery to 5pm.
# If you need a strict 6pm local year-round, add a second trigger at 23:00 UTC
# and gate inside the worker by checking the current US/Eastern hour.
[triggers]
crons = ["0 22 * * 1-5"]

[observability]
enabled = true
