<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broker Cockpit · Aari Transactions</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg:#ffffff;
  --surface:#ffffff;
  --soft-bg:#fafaf6;
  --cream:#faf6ec;
  --ink:#0f0f0f;
  --ink-2:#262626;
  --muted:#6b6b6b;
  --muted-2:#9a9a9a;
  --line:#e8e8e6;
  --line-2:#d4d4d2;
  --gold:#b89968;
  --gold-soft:#f3ecd6;
  --green:#3b6d11;
  --green-soft:#eaf3de;
  --red:#8b1a1a;
  --red-soft:#fbe2e2;
  --amber:#8a7030;
  --amber-soft:#fff4d6;
  --r-sm:8px;
  --r-md:10px;
  --r-lg:14px;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;font-weight:400;font-size:15px;min-height:100vh}

/* MASTHEAD · cream banner aesthetic matching landing-page banner pattern */
.masthead{background:var(--cream);border-bottom:1px solid var(--line);padding:22px 28px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.masthead-l h1{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.masthead-l h2{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);line-height:1.05;letter-spacing:-0.01em}
.masthead-l .sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:0.02em;font-weight:400}
.masthead-r{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.mh-btn{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:var(--r-sm);font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:0.02em;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all 0.18s ease}
.mh-btn:hover{background:var(--ink);color:#fff}
.mh-btn.alt{background:#fff;border-color:var(--line-2)}
.mh-btn.alt:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* GATE */
.gate{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:24px;background:var(--bg)}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:40px 32px;text-align:center;max-width:420px}
.gate-card h2{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:10px;color:var(--ink);line-height:1.1}
.gate-card p{font-size:14px;color:var(--muted);line-height:1.6}

/* CONTENT */
.content{padding:28px 28px 60px;max-width:1320px;margin:0 auto}

/* TEAM STAT STRIP · keeps the bold "team scoreboard" feel but with brand palette */
.team-strip{background:var(--ink);border-radius:var(--r-lg);padding:24px 28px;margin-bottom:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;overflow:hidden}
.team-cell{padding:0 20px;border-right:1px solid rgba(255,255,255,0.08)}
.team-cell:first-child{padding-left:0}
.team-cell:last-child{border-right:none}
.team-cell-lbl{font-family:var(--sans);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#9a9a9a;margin-bottom:8px;font-weight:600}
.team-cell-val{font-family:var(--serif);font-size:32px;font-weight:600;color:#fff;line-height:1;letter-spacing:-0.02em}
.team-cell-sub{font-size:11px;color:#7c7c7c;margin-top:6px;letter-spacing:0.01em}
.team-cell.green .team-cell-val{color:#a6d785}
.team-cell.amber .team-cell-val{color:#d4a72c}

/* SECTION HEADER · matches landing-page section-head pattern */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 18px;flex-wrap:wrap;gap:10px}
.section-head h3{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-0.01em}
.section-head .meta{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:0.02em;font-weight:500}

/* COLUMNS GRID */
.cockpit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px}
.cockpit-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.18s ease}
.cockpit-col:hover{border-color:var(--line-2)}
.col-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--soft-bg);display:flex;justify-content:space-between;align-items:center;gap:10px}
.col-name{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);line-height:1.15;letter-spacing:-0.01em}
.col-role{font-family:var(--sans);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin-top:3px}
.col-link{font-family:var(--sans);font-size:11px;letter-spacing:0.04em;color:var(--gold);text-decoration:none;font-weight:600;padding:6px 12px;border:1px solid var(--gold);border-radius:var(--r-sm);background:#fff;transition:all 0.18s ease}
.col-link:hover{background:var(--gold);color:#fff}
.col-body{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.col-empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55;background:var(--soft-bg);border:1px dashed var(--line-2);border-radius:var(--r-md);margin:20px}
.col-empty strong{display:block;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px;font-style:normal}

/* MINI STAT GRID inside each column */
.col-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.col-stat{background:var(--soft-bg);border-radius:var(--r-sm);padding:12px 8px;text-align:center;border:1px solid var(--line)}
.col-stat-val{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);line-height:1}
.col-stat-lbl{font-family:var(--sans);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:600}
.col-stat.green .col-stat-val{color:var(--green)}
.col-stat.gold .col-stat-val{color:var(--gold)}

/* STAGE BARS */
.stage-bars{display:flex;flex-direction:column;gap:7px}
.stage-bar{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:12px}
.stage-name{flex:0 0 110px;color:var(--muted);font-weight:500}
.stage-track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.stage-fill{height:100%;background:var(--gold);transition:width 0.4s}
.stage-fill.green{background:var(--green)}
.stage-fill.amber{background:var(--amber)}
.stage-fill.ink{background:var(--ink)}
.stage-count{flex:0 0 30px;text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* RECENT ACTIVITY */
.activity-list{display:flex;flex-direction:column;gap:0}
.activity-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:12px;gap:8px}
.activity-row:last-child{border-bottom:none}
.activity-name{font-weight:500;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.activity-stage{flex-shrink:0;font-family:var(--sans);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:10px;font-weight:700;background:var(--soft-bg);color:var(--muted);border:1px solid var(--line)}
.activity-stage.contacted{background:var(--soft-bg);color:var(--muted)}
.activity-stage.convo{background:#eef4ee;color:#3b5c3b;border-color:#d8e6d8}
.activity-stage.ac{background:var(--amber-soft);color:var(--amber);border-color:#ecdfb4}
.activity-stage.raise{background:var(--gold-soft);color:var(--gold);border-color:#e0cf9a}
.activity-stage.disco{background:var(--green-soft);color:var(--green);border-color:#bcd99c}
.activity-stage.signed{background:var(--green);color:#fff;border-color:var(--green)}

/* DAILY LOG BLOCK */
.daily-block{background:var(--soft-bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-family:var(--sans);font-size:12px;color:var(--muted);line-height:1.55}
.daily-block strong{color:var(--ink);font-weight:600}
.daily-block-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.daily-block-row:not(:last-child){border-bottom:1px solid var(--line)}

/* SUB-HEADING inside col */
.col-sub{font-family:var(--sans);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:-4px 0 0}

.empty-msg{font-family:var(--sans);font-size:12px;color:var(--muted);font-style:italic;text-align:center;padding:10px 0}

@media(max-width:680px){
  .masthead{padding:18px 18px 14px}
  .masthead-l h2{font-size:22px}
  .content{padding:20px 16px 40px}
  .team-strip{padding:18px 14px;border-radius:var(--r-md)}
  .team-cell{padding:0 12px;border:none}
  .team-cell-val{font-size:24px}
  .section-head h3{font-size:20px}
  .cockpit-grid{grid-template-columns:1fr}
  .col-stats{grid-template-columns:repeat(2,1fr)}
  .col-name{font-size:20px}
}
</style>
</head>
<body>

<!-- AUTH GATE -->
<div id="gate-view" class="gate" style="display:none">
  <div class="gate-card">
    <h2>Broker Cockpit</h2>
    <p id="gate-msg">Verifying access…</p>
    <p id="gate-action" style="margin-top:18px"></p>
  </div>
</div>

<!-- APP -->
<div id="app-view" style="display:none">

  <!-- Masthead -->
  <header class="masthead">
    <div class="masthead-l">
      <h1>Aari Transactions</h1>
      <h2>Broker Cockpit</h2>
      <div class="sub" id="masthead-date"></div>
    </div>
    <div class="masthead-r">
      <a href="/aari-crm" class="mh-btn alt">Client Tracker</a>
      <a href="/portal" class="mh-btn alt">My Profile</a>
      <a href="#" id="signout-btn" class="mh-btn">Sign out</a>
    </div>
  </header>

  <div class="content">

    <!-- Team-level aggregates -->
    <div class="team-strip" id="team-strip"></div>

    <!-- Section header for per-person columns -->
    <div class="section-head">
      <h3>Team activity</h3>
      <div class="meta" id="team-meta">Loading…</div>
    </div>

    <!-- Per-person columns grid -->
    <div class="cockpit-grid" id="cockpit-grid"></div>

  </div>
</div>

<script src="js/supabase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script>
(function(){
  'use strict';

  const STAGE_ORDER = ['Contacted','In Conversation','Added to AC','Hand Raise','Discovery Booked','Signed'];
  const STAGE_CLASS = {
    'Contacted':'contacted','In Conversation':'convo','Added to AC':'ac',
    'Hand Raise':'raise','Discovery Booked':'disco','Signed':'signed'
  };
  const STAGE_SHORT = {
    'Contacted':'Cont','In Conversation':'Convo','Added to AC':'In AC',
    'Hand Raise':'Raise','Discovery Booked':'Disco','Signed':'Signed','Not Interested':'Out'
  };

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmtDate(d){if(!d)return'';try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch(e){return'';}}

  function showGate(msg, actionHtml){
    document.getElementById('gate-view').style.display='flex';
    document.getElementById('app-view').style.display='none';
    document.getElementById('gate-msg').textContent = msg;
    document.getElementById('gate-action').innerHTML = actionHtml || '';
  }
  function showApp(){
    document.getElementById('gate-view').style.display='none';
    document.getElementById('app-view').style.display='block';
  }

  async function init(){
    if (typeof window.AariAuth === 'undefined') { setTimeout(init, 120); return; }
    try {
      await window.AariAuth.ensureClient();
      const session = await window.AariAuth.getCurrentSession();
      if (!session) {
        showGate('Sign in required.', '<a href="/portal" class="mh-btn" style="display:inline-block;color:var(--black);background:var(--g100);border-color:var(--g200)">Sign in</a>');
        return;
      }
      const profile = await window.AariAuth.getAgentProfile();
      if (!profile) {
        showGate('No staff profile found.', '');
        return;
      }
      if (profile.role !== 'broker') {
        showGate('Broker access only.', '<a href="/portal" class="mh-btn" style="display:inline-block;color:var(--black);background:var(--g100);border-color:var(--g200)">Back to portal</a>');
        return;
      }
      showApp();
      document.getElementById('masthead-date').textContent =
        new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
      document.getElementById('signout-btn').addEventListener('click', async e => {
        e.preventDefault();
        try { await window.AariAuth.signOut(); } catch(_){}
        window.location.href = '/index.html';
      });
      await loadCockpit(profile);
    } catch (e) {
      console.error('[broker-cockpit]', e);
      showGate('Error: ' + (e.message || 'unknown'), '');
    }
  }

  async function loadCockpit(brokerProfile){
    const client = await window.AariAuth.ensureClient();

    // Pull: all bd_contacts, all bd_daily_logs, all staff agents (tc + broker)
    const [contactsR, logsR, agentsR] = await Promise.all([
      client.from('bd_contacts').select('*').order('last_touch_at',{ascending:false}),
      client.from('bd_daily_logs').select('*').order('log_date',{ascending:false}),
      client.from('agents').select('id, first_name, last_name, email, role').in('role',['tc','broker']),
    ]);

    if (contactsR.error || logsR.error || agentsR.error) {
      console.error('[broker-cockpit] load error', contactsR.error || logsR.error || agentsR.error);
    }
    const contacts = contactsR.data || [];
    const logs = logsR.data || [];
    const agents = agentsR.data || [];

    // Always show columns for: Eileen Hernandez, Marlenyi Paredes ("Mile"), then any other staff with bd activity
    const KNOWN_TEAM = ['eileen','marlenyi'];
    const byId = {};
    agents.forEach(a => { byId[a.id] = a; });

    // Build team list: any agent with role tc|broker
    let team = agents.slice();
    // Stable sort: Mile first (broker), Eileen, then others alpha by first_name
    team.sort((a,b) => {
      const ar = (a.role==='broker')?0:1, br = (b.role==='broker')?0:1;
      if (ar !== br) return ar - br;
      return (a.first_name||'').localeCompare(b.first_name||'');
    });

    // ---- TEAM AGGREGATE STRIP ----
    const today = new Date(); today.setHours(0,0,0,0);
    const weekStart = new Date(today); weekStart.setDate(today.getDate() - 6);
    const totalContacts = contacts.length;
    const teamHandRaises = contacts.filter(c => c.stage === 'Hand Raise').length;
    const teamSigned = contacts.filter(c => c.stage === 'Signed').length;
    const teamInAC = contacts.filter(c => ['Added to AC','Hand Raise','Discovery Booked','Signed'].includes(c.stage)).length;
    const weekLogs = logs.filter(l => {
      try { return new Date(l.log_date + 'T00:00:00') >= weekStart; } catch(_){ return false; }
    });
    const weekDms = weekLogs.reduce((s,l) => s + (l.dms_sent||0), 0);
    const weekDisco = weekLogs.reduce((s,l) => s + (l.discos_booked||0), 0);

    document.getElementById('team-strip').innerHTML = `
      <div class="team-cell"><div class="team-cell-lbl">Total contacts</div><div class="team-cell-val">${totalContacts}</div><div class="team-cell-sub">${teamInAC} in AC</div></div>
      <div class="team-cell"><div class="team-cell-lbl">DMs this week</div><div class="team-cell-val">${weekDms}</div><div class="team-cell-sub">Across team</div></div>
      <div class="team-cell amber"><div class="team-cell-lbl">Hand raises</div><div class="team-cell-val">${teamHandRaises}</div><div class="team-cell-sub">Awaiting follow-up</div></div>
      <div class="team-cell"><div class="team-cell-lbl">Discos booked</div><div class="team-cell-val">${weekDisco}</div><div class="team-cell-sub">This week</div></div>
      <div class="team-cell green"><div class="team-cell-lbl">Signed</div><div class="team-cell-val">${teamSigned}</div><div class="team-cell-sub">Lifetime</div></div>
    `;

    document.getElementById('team-meta').textContent =
      team.length + ' member' + (team.length === 1 ? '' : 's') + ' · ' + contacts.length + ' contacts · ' + logs.length + ' daily logs';

    // ---- PER-PERSON COLUMNS ----
    const grid = document.getElementById('cockpit-grid');
    if (!team.length) {
      grid.innerHTML = '<div class="col-empty"><strong>No team members yet.</strong>Add a TC under role=\'tc\' or broker under role=\'broker\' in the agents table.</div>';
      return;
    }
    grid.innerHTML = team.map(person => renderPersonColumn(person, contacts, logs)).join('');
  }

  function renderPersonColumn(person, allContacts, allLogs){
    const personContacts = allContacts.filter(c => c.owner_id === person.id);
    const personLogs = allLogs.filter(l => l.owner_id === person.id);
    const fullName = (person.first_name + ' ' + person.last_name).trim();
    const roleLbl = person.role === 'broker' ? 'Broker' : 'TC';

    // Determine per-person cockpit deep link
    const firstLower = (person.first_name||'').toLowerCase();
    const deepLink = firstLower === 'eileen' ? '/eileen.html' : '#';

    if (!personContacts.length && !personLogs.length) {
      return `
        <div class="cockpit-col">
          <div class="col-head">
            <div>
              <div class="col-name">${esc(fullName)}</div>
              <div class="col-role">${esc(roleLbl)}</div>
            </div>
            ${deepLink !== '#' ? `<a class="col-link" href="${deepLink}">Open ↗</a>` : ''}
          </div>
          <div class="col-empty">
            <strong>No activity yet.</strong>
            ${firstLower === 'marlenyi' || firstLower === 'mile'
              ? 'Start logging your own outreach to populate this column. Same Tracker UI as Eileen.'
              : 'No BD contacts or daily logs recorded for this person yet.'}
          </div>
        </div>
      `;
    }

    // Stage breakdown
    const stageCounts = {};
    STAGE_ORDER.forEach(s => { stageCounts[s] = 0; });
    personContacts.forEach(c => {
      if (stageCounts.hasOwnProperty(c.stage)) stageCounts[c.stage]++;
    });
    const maxStage = Math.max(1, ...Object.values(stageCounts));

    // Today's stats
    const today = new Date(); today.setHours(0,0,0,0);
    const todayStr = today.toISOString().slice(0,10);
    const todayLog = personLogs.find(l => l.log_date === todayStr) || {};
    const todayDms = todayLog.dms_sent || 0;

    // This week (last 7 days)
    const weekStart = new Date(today); weekStart.setDate(today.getDate() - 6);
    const weekDms = personLogs
      .filter(l => { try { return new Date(l.log_date+'T00:00:00') >= weekStart; } catch(_){return false;} })
      .reduce((s,l) => s + (l.dms_sent||0), 0);

    // Recent contacts (last 5)
    const recentContacts = personContacts
      .slice()
      .sort((a,b) => String(b.last_touch_at||'').localeCompare(String(a.last_touch_at||'')))
      .slice(0,5);

    // Recent daily logs (last 3)
    const recentLogs = personLogs.slice(0,3);

    const stageBars = STAGE_ORDER.map(s => {
      const count = stageCounts[s] || 0;
      const pct = (count / maxStage) * 100;
      const cls = s === 'Signed' ? 'green' : (s === 'Hand Raise' || s === 'Discovery Booked' ? 'amber' : (s === 'In Conversation' ? 'blue' : ''));
      return `
        <div class="stage-bar">
          <div class="stage-name">${esc(STAGE_SHORT[s] || s)}</div>
          <div class="stage-track"><div class="stage-fill ${cls}" style="width:${pct}%"></div></div>
          <div class="stage-count">${count}</div>
        </div>
      `;
    }).join('');

    const activityRows = recentContacts.length ? recentContacts.map(c => `
      <div class="activity-row">
        <div class="activity-name">${esc(c.name || '(unnamed)')}</div>
        <div class="activity-stage ${STAGE_CLASS[c.stage] || ''}">${esc(STAGE_SHORT[c.stage] || c.stage || '')}</div>
      </div>
    `).join('') : '<div class="empty-msg">No contacts yet.</div>';

    const logRows = recentLogs.length ? recentLogs.map(l => `
      <div class="daily-block-row">
        <span>${esc(fmtDate(l.log_date))}</span>
        <span><strong>${l.dms_sent||0}</strong> DMs · <strong>${l.replies||0}</strong> replies · <strong>${l.discos_booked||0}</strong> disco</span>
      </div>
    `).join('') : '<div class="empty-msg" style="padding:0">No daily logs.</div>';

    return `
      <div class="cockpit-col">
        <div class="col-head">
          <div>
            <div class="col-name">${esc(fullName)}</div>
            <div class="col-role">${esc(roleLbl)} · ${personContacts.length} contacts</div>
          </div>
          ${deepLink !== '#' ? `<a class="col-link" href="${deepLink}">Open ↗</a>` : ''}
        </div>
        <div class="col-body">
          <div class="col-stats">
            <div class="col-stat"><div class="col-stat-val">${todayDms}</div><div class="col-stat-lbl">DMs today</div></div>
            <div class="col-stat"><div class="col-stat-val">${weekDms}</div><div class="col-stat-lbl">DMs / wk</div></div>
            <div class="col-stat lav"><div class="col-stat-val">${stageCounts['Hand Raise']||0}</div><div class="col-stat-lbl">Raises</div></div>
            <div class="col-stat green"><div class="col-stat-val">${stageCounts['Signed']||0}</div><div class="col-stat-lbl">Signed</div></div>
          </div>

          <div>
            <div class="col-sub">Stage funnel</div>
