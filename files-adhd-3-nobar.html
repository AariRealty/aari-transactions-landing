<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawer ADHD · Mock 3 · No sticky Do-Now bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff;--cream:#faf7ef;--ink:#0a0a0a;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--gold:#c69a3a;--green:#3e7d57;--sans:'Inter',-apple-system,sans-serif;--serif:Georgia,'Times New Roman',serif;--playfair:'Playfair Display',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;padding:0 0 40px}

  /* MOCK 3 · NO STICKY BAR
     Same Today / This week / Later buckets she picked, but with the
     redundant black "Do this now" bar removed. The Today card IS the
     hero action now (bigger Send pill, more breathing room). One place
     to look — no dupes. */

  .top{position:sticky;top:0;background:#fff;border-bottom:0.5px solid #ece8e0;padding:11px 14px;display:flex;align-items:center;gap:10px;z-index:6}
  .top .back{background:none;border:0;color:var(--ink);font:600 13px 'Inter';padding:8px 4px}
  .top .addr{flex:1;font-family:var(--serif);font-size:14.5px;font-weight:600}
  .top .close{background:var(--ink);color:#fff;border:0;border-radius:20px;padding:7px 12px;font:700 12px 'Inter'}

  .chips{position:sticky;top:54px;background:#fafafa;padding:10px 14px 8px;display:flex;gap:6px;overflow-x:auto;z-index:5;border-bottom:0.5px solid #ede8d8}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:#fff;border:0.5px solid #e0dbc9;font:600 11px 'Inter';color:var(--muted);white-space:nowrap;min-height:32px;display:inline-flex;align-items:center;gap:5px}
  .chip .n{font-family:var(--playfair);font-size:11.5px;color:var(--muted-2)}
  .chip.done{color:var(--ink)}
  .chip.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.cur .n{color:#d6d1c6}
  .chip.lck{opacity:.5}

  /* TODAY bucket · promoted to the primary action hero (no bar below,
     so the Send pill inside the card is the ONLY Send). Slightly beefier
     Send pill so the eye lands on it. */
  .today{margin:14px 14px 12px;background:#fff;border-radius:16px;padding:16px;border:0.5px solid rgba(15,15,15,0.06);box-shadow:0 4px 16px rgba(15,15,15,0.05)}
  .today .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .today .hd .lbl{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.3px;color:var(--ink)}
  .today .hd .ct{font-family:var(--playfair);font-size:15px;font-weight:500;color:var(--muted)}
  .today .row{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:0.5px solid #f2eee2;font-size:13.5px}
  .today .row:first-of-type{border-top:0}
  .today .row .cb{width:20px;height:20px;border-radius:5px;border:1.5px solid #c9c3b3;flex:none;margin-top:2px}
  .today .row .body{flex:1;min-width:0}
  .today .row .nm{font-weight:600;color:var(--ink);line-height:1.3;font-size:14.5px}
  .today .row .meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .today .row .tag{display:inline-block;font:700 9px 'Inter';letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
  .today .row .tag.title{background:#eef1f6;color:#0c447c}
  .today .row .tag.loan{background:#f6edd9;color:#8a6a1f}
  /* Beefier Send pill · the ONLY Send on the page now, so it's the
     unambiguous "do this now" button. */
  .today .row .send{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:700 12.5px 'Inter';cursor:pointer;flex:none;margin-top:0;box-shadow:0 3px 10px rgba(15,15,15,0.14)}
  .today .row .send:hover{background:#2a2a2a}

  /* THIS WEEK bucket · slim strip */
  .week{margin:0 14px 12px;background:#fff;border-radius:14px;padding:12px 16px;border:0.5px solid rgba(15,15,15,0.06)}
  .week .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  .week .hd .lbl{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink)}
  .week .hd .ct{font-family:var(--playfair);font-size:13px;font-weight:500;color:var(--muted)}
  .week .r{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:0.5px solid #f2eee2;font-size:12.5px}
  .week .r:first-of-type{border-top:0}
  .week .r .cb{width:14px;height:14px;border:1.5px solid #c9c3b3;border-radius:3px;flex:none}
  .week .r .nm{flex:1;color:var(--ink)}
  .week .r .d{font:500 11px var(--playfair);color:var(--muted-2)}
  .week .r .tag{font:700 9px 'Inter';letter-spacing:.6px;text-transform:uppercase;padding:2px 6px;border-radius:5px;flex:none}
  .week .r .tag.insp{background:#eef3ea;color:#5f6f57}
  .week .r .tag.title{background:#eef1f6;color:#0c447c}
  .week .r .tag.loan{background:#f6edd9;color:#8a6a1f}

  /* LATER bucket · counter only */
  .later{margin:0 14px;padding:12px 16px;background:transparent;text-align:center}
  .later .btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:0.5px dashed #d9d1bc;border-radius:999px;padding:9px 16px;font:600 12px 'Inter';color:var(--muted);cursor:pointer}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:60}
</style>
</head>
<body>

<div class="top">
  <button class="back">← All files</button>
  <span class="addr">816 Frederick Reid St E</span>
  <button class="close">× Close</button>
</div>

<div class="chips">
  <span class="chip done">✓ New</span>
  <span class="chip done">✓ Setup</span>
  <span class="chip cur">Under contract <span class="n">1/19</span></span>
  <span class="chip lck">Clear to close</span>
  <span class="chip lck">Closed</span>
</div>

<div class="today">
  <div class="hd"><span class="lbl">Today</span><span class="ct">1 to do</span></div>
  <div class="row">
    <div class="cb"></div>
    <div class="body">
      <div class="nm">Request survey + title policy</div>
      <div class="meta"><span class="tag title">Title</span><span>Due in 2 days &middot; Eileen</span></div>
    </div>
    <button class="send">Send &rarr;</button>
  </div>
</div>

<div class="week">
  <div class="hd"><span class="lbl">This week</span><span class="ct">3</span></div>
  <div class="r"><span class="cb"></span><span class="tag loan">Loan</span><span class="nm">Confirm loan approval</span><span class="d">Aug 6</span></div>
  <div class="r"><span class="cb"></span><span class="tag title">Title</span><span class="nm">Order lien search</span><span class="d">Aug 8</span></div>
  <div class="r"><span class="cb"></span><span class="tag insp">Insp</span><span class="nm">Confirm inspection scheduled</span><span class="d">Aug 9</span></div>
</div>

<div class="later">
  <button class="btn">&#128337; 14 more &middot; later this stage &rarr;</button>
</div>

<div class="mock-chip">No bar &middot; Today = hero</div>

</body>
</html>
