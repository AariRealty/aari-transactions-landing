<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock 2 · Concierge · Aari Transactions Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --cream:#faf7ef;
    --ink:#0a0a0a;
    --ink-2:#3d3a34;
    --muted:#7a756c;
    --line:#eae5d6;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}

  /* Homepage nav */
  .nav{position:sticky;top:0;z-index:90;background:rgba(251,249,244,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
  .nav-wrap{max-width:720px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{height:40px;width:auto;display:block}
  .brand .name{font-weight:700;font-size:14px;letter-spacing:-0.01em}
  .brand .name small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-top:2px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none}

  /* CONCIERGE CARD — full-bleed dark card asks the question */
  .cx-wrap{max-width:720px;margin:0 auto;padding:26px 20px 40px}
  .cx-card{background:var(--ink);color:#fff;border-radius:24px;padding:34px 26px;box-shadow:0 10px 30px rgba(10,10,10,0.10)}
  .cx-eb{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:16px}
  .cx-h{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;letter-spacing:-0.4px}
  .cx-h em{font-style:italic;color:#fff}

  .cx-opts{margin-top:26px;display:grid;gap:12px}
  .cx-opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:14px;text-decoration:none;color:#fff;transition:background .15s ease}
  .cx-opt:active,.cx-opt:hover{background:rgba(255,255,255,0.13)}
  .cx-opt .lbl{font-size:15px;font-weight:600;letter-spacing:-0.1px}
  .cx-opt .lbl small{display:block;font-size:11.5px;color:rgba(255,255,255,0.55);font-weight:500;margin-top:3px}
  .cx-opt .arr{font-size:20px;color:rgba(255,255,255,0.55);line-height:1}

  .cx-foot{margin-top:22px;text-align:center}
  .cx-foot a{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;border-bottom:1px solid transparent;padding-bottom:2px}
  .cx-foot a:hover{border-bottom-color:var(--muted)}

  /* Preview chip */
  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a class="brand" href="/portal">
      <img src="images/aari-logo.png" alt="Aari Transactions">
      <span class="name">Aari Transactions<small>Florida TC</small></span>
    </a>
    <a class="av" href="/portal">M</a>
  </div>
</nav>

<section class="cx-wrap">
  <div class="cx-card">
    <div class="cx-eb">Home · Saturday, July 25</div>
    <h1 class="cx-h">Marlenyi,<br>what are we <em>doing today?</em></h1>

    <div class="cx-opts">
      <a class="cx-opt" href="/files.html">
        <span class="lbl">Moving files<small>Kanban · playbook · closings</small></span>
        <span class="arr">›</span>
      </a>
      <a class="cx-opt" href="/aari-agent-crm.html">
        <span class="lbl">Working with agents<small>Leads · pipeline · CRM</small></span>
        <span class="arr">›</span>
      </a>
      <a class="cx-opt" href="/index.html?modal-only=1#apply">
        <span class="lbl">Sending in a new contract<small>Submit a file to Aari</small></span>
        <span class="arr">›</span>
      </a>
    </div>
  </div>

  <p class="cx-foot"><a href="#">See everything ↓</a></p>
</section>

<div class="mock-chip">
  Mock <a href="/home-mock-1.html">1</a> <a href="/home-mock-2.html" class="on">2</a> <a href="/home-mock-3.html">3</a>
</div>

</body>
</html>
