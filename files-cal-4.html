<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Cal Mock 4 · No cream · slim tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ffffff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
  .nav{position:sticky;top:0;z-index:90;background:rgba(251,249,244,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
  .nav-wrap{max-width:720px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{height:40px;width:auto;display:block}
  .brand .name{font-weight:700;font-size:14px;letter-spacing:-0.01em}
  .brand .name small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-top:2px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none}
  main{max-width:720px;margin:0 auto;padding:20px 16px 40px}

  /* CAL MOCK 4 · Cal 01 base · NO CREAM inside · SLIM closing tiles */
  .cal-block{background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:16px;overflow:hidden}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 12px;border-bottom:1px solid #f3ede0}
  .cal-title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.3px}
  .cal-ctrls{display:flex;gap:6px;align-items:center}
  .sync-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:0.5px solid rgba(15,15,15,0.18);border-radius:8px;padding:7px 10px;font:600 11px 'Inter',sans-serif;color:var(--ink);cursor:pointer;min-height:36px}
  .seg{display:inline-flex;background:#f3ede0;border-radius:999px;overflow:hidden;padding:2px}
  .seg button{background:none;border:0;padding:6px 12px;font:600 11.5px 'Inter',sans-serif;color:var(--muted);cursor:pointer;border-radius:999px;min-height:30px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* Closings · same white background as rest of card · slim tiles */
  .next{padding:12px 14px;border-bottom:1px solid #f3ede0}
  .next-eb{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
  .next-eb a{font-size:11px;color:var(--ink);text-decoration:none;font-weight:600;letter-spacing:.3px;text-transform:none}
  .next-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:1px}
  .next-row::-webkit-scrollbar{display:none}
  .next-tile{flex:0 0 38%;background:transparent;border:0.5px solid rgba(15,15,15,0.10);border-radius:7px;padding:6px 9px;text-decoration:none;color:var(--ink)}
  .next-tile .d{font-family:var(--serif);font-size:14px;font-weight:600;line-height:1;letter-spacing:-0.2px}
  .next-tile .ad{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .next-tile .days{font-size:9.5px;color:var(--muted);margin-top:1px;font-weight:600;letter-spacing:0.3px}

  /* Week strip · unchanged */
  .wk{padding:14px 12px 16px}
  .wk-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
  .wk-title{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
  .wk-nav{display:flex;gap:6px}
  .wk-nav button{width:32px;height:32px;border-radius:8px;background:#fff;border:0.5px solid rgba(15,15,15,0.10);color:var(--ink);cursor:pointer;font-size:14px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .day{background:#f4f1e6;border-radius:9px;padding:8px 4px 10px;text-align:center;position:relative;min-height:60px;cursor:pointer}
  .day.on{background:var(--ink);color:#fff}
  .day .w{font-size:9px;font-weight:600;letter-spacing:.4px;color:inherit;opacity:.65;display:block}
  .day .n{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;margin-top:2px;color:inherit;line-height:1}
  .day .b{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .day.on .b{background:#fff;color:var(--ink)}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:10px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a class="brand" href="/portal"><img src="images/aari-logo.png" alt="Aari Transactions"><span class="name">Aari Transactions<small>Florida TC</small></span></a>
    <a class="av" href="/portal">M</a>
  </div>
</nav>

<main>
  <div class="cal-block">
    <div class="cal-head">
      <h2 class="cal-title">Calendar</h2>
      <div class="cal-ctrls">
        <button class="sync-btn">📅 Sync</button>
        <div class="seg"><button class="on">Month</button><button>Week</button></div>
      </div>
    </div>

    <div class="next">
      <div class="next-eb"><span>Next closings</span><a href="#">View all →</a></div>
      <div class="next-row">
        <a class="next-tile" href="#"><div class="d">Aug 5</div><div class="ad">4700 32nd Ave SW</div><div class="days">11 days</div></a>
        <a class="next-tile" href="#"><div class="d">Aug 6</div><div class="ad">3815 NW 22nd Ter</div><div class="days">12 days</div></a>
        <a class="next-tile" href="#"><div class="d">Aug 12</div><div class="ad">1130 NW 14th Ter</div><div class="days">18 days</div></a>
      </div>
    </div>

    <div class="wk">
      <div class="wk-head">
        <div class="wk-title">Jul 19 – Jul 25</div>
        <div class="wk-nav"><button>‹</button><button>›</button></div>
      </div>
      <div class="days">
        <div class="day"><span class="w">S</span><span class="n">19</span></div>
        <div class="day"><span class="w">M</span><span class="n">20</span><span class="b">7</span></div>
        <div class="day"><span class="w">T</span><span class="n">21</span></div>
        <div class="day"><span class="w">W</span><span class="n">22</span><span class="b">2</span></div>
        <div class="day"><span class="w">T</span><span class="n">23</span><span class="b">1</span></div>
        <div class="day"><span class="w">F</span><span class="n">24</span><span class="b">1</span></div>
        <div class="day on"><span class="w">S</span><span class="n">25</span><span class="b">1</span></div>
      </div>
    </div>
  </div>
</main>

<div class="mock-chip">
  Cal <a href="/files-cal-1.html">1</a> <a href="/files-cal-2.html">2</a> <a href="/files-cal-3.html">3</a> <a href="/files-cal-4.html" class="on">4</a> <a href="/files-cal-5.html">5</a> <a href="/files-cal-6.html">6</a>
</div>

</body>
</html>
