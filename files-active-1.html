<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active files · Mock 1 · Compact stat strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ffffff;--cream:#faf7ef;--ink:#0a0a0a;--ink-2:#3d3a34;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--sans:'Inter',-apple-system,sans-serif;--serif:Georgia,'Times New Roman',serif;--playfair:'Playfair Display',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;padding:16px 16px 40px}

  /* MOCK 1 · Compact stat strip · pipeline demoted from a big cream card to a subtle ledger strip */
  .hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .hdr .title{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-0.2px}
  .hdr .seg{display:inline-flex;background:#f4f1ec;border-radius:20px;padding:2px}
  .hdr .seg button{border:0;background:transparent;font:600 11px 'Inter',sans-serif;color:#7a756c;padding:5px 11px;border-radius:18px;cursor:pointer}
  .hdr .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  .search{position:relative;margin-bottom:14px}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:13px}
  .search input{width:100%;background:#fff;border:0.5px solid rgba(15,15,15,0.16);border-radius:10px;padding:10px 12px 10px 36px;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;min-height:42px}
  .search input::placeholder{color:#a09a8f}

  /* Pipeline as a subtle ledger strip · not a big cream card */
  .strip{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:2px 4px 14px}
  .strip .eb{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted-2);flex-basis:100%;margin-bottom:2px}
  .strip b{font-family:var(--playfair);font-size:17px;font-weight:500;color:var(--ink);margin-right:3px}
  .strip .sep{color:var(--muted-2)}
  .strip .more{font-size:11px;color:var(--ink);text-decoration:underline;text-underline-offset:2px;margin-left:auto;font-weight:600}

  .tabs{display:flex;gap:8px;padding:0 4px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:#fff;border:0.5px solid rgba(15,15,15,0.14);font:600 12px 'Inter',sans-serif;color:var(--ink);cursor:pointer;text-decoration:none;min-height:34px;display:inline-flex;align-items:center;gap:6px}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill .n{font-family:var(--playfair);font-size:14px;font-weight:500}

  .kanban{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
  .kanban::-webkit-scrollbar{display:none}
  .lane{flex:0 0 82%;background:#fff;border:0.5px solid rgba(15,15,15,0.10);border-radius:14px;padding:12px 12px 14px;min-height:220px;scroll-snap-align:start;position:relative}
  .lane::before{content:'';position:absolute;left:12px;top:12px;bottom:12px;width:3px;background:var(--ink);border-radius:2px;opacity:0.15}
  .lane.on::before{opacity:0.9}
  .lane .lh{display:flex;align-items:baseline;justify-content:space-between;padding:0 0 10px 10px;border-bottom:0.5px solid #f3ede0;margin-bottom:10px}
  .lane .lh .name{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
  .lane .lh .sub{font-size:9.5px;color:var(--muted);letter-spacing:0.3px;font-weight:500}
  .lane .lh .ct{font-family:var(--playfair);font-size:20px;font-weight:500;color:var(--ink)}
  .empty{padding:16px 10px;text-align:center;color:var(--muted-2);font-size:11.5px;font-style:italic}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<div class="hdr">
  <h2 class="title">Active files</h2>
  <div class="seg"><button class="on">Overview</button><button>Invoice</button></div>
</div>

<div class="search">
  <span class="ic">🔍</span>
  <input placeholder="Search address, client, agent…">
</div>

<div class="strip">
  <span class="eb">Pipeline net · if all 22 close</span>
  <span><b>$274</b>net</span>
  <span class="sep">·</span>
  <span><b>$2,194</b>revenue</span>
  <span><b>$1,920</b>coord pay</span>
  <span><b>$964</b>realized</span>
  <a class="more" href="#">Breakdown ▾</a>
</div>

<div class="tabs">
  <a class="pill on" href="#">Sales <span class="n">7</span></a>
  <a class="pill" href="#">Listings <span class="n">15</span></a>
  <a class="pill" href="#">All</a>
  <a class="pill" href="#">File org <span class="n">1</span></a>
</div>

<div class="kanban">
  <div class="lane on"><div class="lh"><div><span class="name">New</span><div class="sub">awaiting TC</div></div><span class="ct">0</span></div><div class="empty">No new files</div></div>
  <div class="lane"><div class="lh"><div><span class="name">Setup</span><div class="sub">TC starting</div></div><span class="ct">2</span></div><div class="empty">2 files</div></div>
  <div class="lane"><div class="lh"><div><span class="name">Executed</span><div class="sub">under contract</div></div><span class="ct">5</span></div><div class="empty">5 files</div></div>
</div>

<div class="mock-chip">
  Active <a href="/files-active-1.html" class="on">1</a> <a href="/files-active-2.html">2</a> <a href="/files-active-3.html">3</a>
</div>

</body>
</html>
