<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock 3 · Daily Brief · Aari Transactions Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --cream:#faf7ef;
    --ink:#0a0a0a;
    --ink-2:#3d3a34;
    --muted:#7a756c;
    --line:#eae5d6;
    --sage:#a4b8a6;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  /* Homepage nav */
  .nav{position:sticky;top:0;z-index:90;background:rgba(251,249,244,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
  .nav-wrap{max-width:720px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{height:40px;width:auto;display:block}
  .brand .name{font-weight:700;font-size:14px;letter-spacing:-0.01em}
  .brand .name small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-top:2px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none}

  /* PERSONAL DAILY BRIEF */
  .db-hero{max-width:720px;margin:0 auto;padding:32px 20px 8px}
  .db-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:14px}
  .db-eb{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .db-date{font-size:11px;color:var(--muted);font-weight:500}
  .db-greet{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;letter-spacing:-0.4px}
  .db-greet em{font-style:italic;color:var(--ink-2)}

  /* Pulse card — today at a glance */
  .db-pulse{margin:22px 20px 0;max-width:calc(720px - 40px);margin-left:auto;margin-right:auto;background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:22px 22px}
  .db-pulse-eb{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .db-pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--sage)}
  .db-pulse-h{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.3px;line-height:1.25;color:var(--ink)}
  .db-pulse-h em{font-style:italic;color:var(--ink-2)}
  .db-pulse-stat{display:flex;gap:24px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .db-stat{flex:1}
  .db-stat .num{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-0.5px;line-height:1}
  .db-stat .lbl{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-top:6px;display:block}

  /* Tiles */
  .db-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:24px 20px 8px;max-width:720px;margin:0 auto}
  .db-tile{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);min-height:96px}
  .db-tile .ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5}
  .db-tile .n{flex:1;font-size:14px;font-weight:700;letter-spacing:-0.1px;line-height:1.2}
  .db-tile .n small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px;letter-spacing:0}
  .db-tile .arr{color:var(--muted);font-size:18px;line-height:1}

  /* More link */
  .db-more{display:block;text-align:center;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:26px 20px 40px}
  .db-more:hover{color:var(--ink)}

  /* Preview chip */
  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px;align-items:center}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a class="brand" href="/portal">
      <img src="images/aari-logo.png" alt="Aari Transactions">
      <span class="name">Aari Transactions<small>Florida TC</small></span>
    </a>
    <a class="av" href="/portal">M</a>
  </div>
</nav>

<section class="db-hero">
  <div class="db-row">
    <span class="db-eb">Home</span>
    <span class="db-date">Sat · Jul 25 · 5:52 PM</span>
  </div>
  <h1 class="db-greet">Good afternoon,<br><em>Marlenyi.</em></h1>
</section>

<div class="db-pulse">
  <div class="db-pulse-eb"><span class="db-pulse-dot"></span>The Aari pulse</div>
  <div class="db-pulse-h">Nothing urgent flagged. <em>The team is on it.</em></div>
  <div class="db-pulse-stat">
    <div class="db-stat"><div class="num">0</div><span class="lbl">Files needing you</span></div>
    <div class="db-stat"><div class="num">0</div><span class="lbl">Closing this week</span></div>
  </div>
</div>

<div class="db-tiles">
  <a class="db-tile" href="/files.html">
    <svg class="ic" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    <span class="n">Move the files<small>Kanban · playbook</small></span>
    <span class="arr">›</span>
  </a>
  <a class="db-tile" href="/aari-agent-crm.html">
    <svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span class="n">Agent Portal<small>Leads · CRM</small></span>
    <span class="arr">›</span>
  </a>
</div>

<a class="db-more" href="#">More options ↓</a>

<div class="mock-chip">
  Mock <a href="/home-mock-1.html">1</a> <a href="/home-mock-2.html">2</a> <a href="/home-mock-3.html" class="on">3</a>
</div>

</body>
</html>
