<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage advance · Mock 2 · Timeline dot glows + "Advance" chip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff;--cream:#faf7ef;--ink:#0a0a0a;--muted:#7a756c;--muted-2:#a9a49a;--line:#eae5d6;--red:#a3402f;--gold:#c69a3a;--green:#3e7d57;--sans:'Inter',-apple-system,sans-serif;--serif:Georgia,'Times New Roman',serif;--playfair:'Playfair Display',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;padding:0 0 132px}

  /* MOCK 2 · TIMELINE DOT GLOWS + "ADVANCE" CHIP
     Nothing new appears in the drawer chrome. Instead the CURRENT stage's
     row shows a small green "Ready to advance ›" chip inline, and the NEXT
     stage's timeline dot lights up and gently pulses so the eye is drawn to
     it. Feels native to the existing timeline layout — no extra banner, no
     interruption. Marlenyi decides when to advance; the timeline is just
     signaling readiness. */

  .top{background:#fff;border-bottom:0.5px solid #ece8e0;padding:11px 14px;display:flex;align-items:center;gap:10px}
  .top .back{background:none;border:0;color:var(--ink);font:600 13px 'Inter';padding:8px 4px}
  .top .addr{flex:1;font-family:var(--serif);font-size:14.5px;font-weight:600}
  .top .close{background:var(--ink);color:#fff;border:0;border-radius:20px;padding:7px 12px;font:700 12px 'Inter'}

  .tl{position:relative;padding:16px 16px 16px 44px}
  .tl::before{content:'';position:absolute;left:23px;top:26px;bottom:16px;width:2px;background:#e8e2d1}

  .stg{position:relative;margin-bottom:12px}
  .stg::before{content:'';position:absolute;left:-28px;top:12px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #d9d1bc}
  .stg.done::before{background:var(--ink);border-color:var(--ink);content:'✓';color:#fff;font-size:9.5px;text-align:center;line-height:12px;font-weight:700}
  .stg.cur::before{background:#fff;border-color:var(--ink);box-shadow:0 0 0 4px rgba(15,15,15,0.06)}

  /* THE NEW BIT · next stage dot glows green + gently pulses */
  .stg.ready-next::before{background:#fff;border-color:var(--green);box-shadow:0 0 0 4px rgba(62,125,87,0.14);animation:readyPulse 1.8s ease-in-out infinite}
  @keyframes readyPulse{0%,100%{box-shadow:0 0 0 4px rgba(62,125,87,0.14)}50%{box-shadow:0 0 0 8px rgba(62,125,87,0.06)}}

  .stg .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border:0.5px solid rgba(15,15,15,0.06);border-radius:12px}
  .stg.done .hd{background:#fbfaf6;border-color:#f0ecdd}
  .stg .hd .nm{flex:1;font-family:var(--serif);font-size:14px;font-weight:600}
  .stg.done .hd .nm{color:#5f5647}
  .stg .hd .meta{font:500 11px var(--playfair);color:var(--muted-2)}
  .stg .hd .chev{color:var(--muted-2);font-size:14px;margin-left:6px}

  /* Green "ready to advance" chip · lives inline on the current stage row */
  .adv-chip{background:#eef4ee;color:#2c5f42;border:0.5px solid #cbe0d1;border-radius:999px;padding:5px 12px;font:700 11px 'Inter';cursor:pointer;display:inline-flex;align-items:center;gap:5px;letter-spacing:0.2px}
  .adv-chip::after{content:'›';font-size:14px;line-height:1}

  /* Ready-next stage · label picks up green tint */
  .stg.ready-next .hd{border-color:#cbe0d1;background:#f6fbf8}
  .stg.ready-next .hd .nm{color:#2c5f42}
  .stg.ready-next .hd .meta{color:#5f9e79;font-weight:600}

  .caption{text-align:center;color:var(--muted-2);font-size:11px;font-style:italic;padding:0 14px 4px}

  .mock-chip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:100;display:flex;gap:14px}
  .mock-chip a{color:#fff;text-decoration:none;opacity:.7}
  .mock-chip a.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<div class="top">
  <button class="back">← All files</button>
  <span class="addr">816 Frederick Reid St E</span>
  <button class="close">× Close</button>
</div>

<p class="caption">Current stage picks up a green chip · next-stage dot glows + pulses.</p>

<div class="tl">
  <div class="stg done"><div class="hd"><span class="nm">Terms & dates</span><span class="meta">closing Aug 14</span><span class="chev">›</span></div></div>

  <div class="stg cur">
    <div class="hd">
      <span class="nm">Under contract</span>
      <span class="adv-chip">Advance</span>
      <span class="meta">15/18</span>
      <span class="chev">›</span>
    </div>
  </div>

  <div class="stg ready-next">
    <div class="hd">
      <span class="nm">Appraisal</span>
      <span class="meta">Ready when you are</span>
      <span class="chev">›</span>
    </div>
  </div>

  <div class="stg"><div class="hd"><span class="nm">Clear to close</span><span class="meta">6 tasks</span><span class="chev">›</span></div></div>
</div>

<div class="mock-chip">
  Stage advance <a href="/files-advance-1.html">1</a> <a href="/files-advance-2.html" class="on">2</a> <a href="/files-advance-3.html">3</a>
</div>

</body>
</html>
